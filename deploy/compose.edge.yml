# vm-edge: Caddy(HTTPS)와 Gateway·플랫폼·조회 쪽 서비스.
# 실행: docker compose -f /opt/ticket/deploy/compose.edge.yml --env-file /opt/ticket/.env up -d
#
# 앱은 network_mode: host로 띄운다. 컨테이너가 EC2의 VPC IP를 그대로 써서, 다른 서버(vm-core·vm-data)가 Eureka에 등록된 주소로
# 바로 찾아온다. 그래서 컨테이너마다 포트가 겹치지 않아야 하고, 포트 공개(ports)는 쓰지 않는다.
# 인터넷에서는 Caddy의 80·443만 닿아야 한다. 8080·8081·8082·8085·8761·8888은 보안 그룹으로 VPC 안에만 연다.
# 서비스는 Gateway가 넣은 X-User-* 헤더를 그대로 믿으므로, 서비스 포트가 인터넷에 열리면 누구나 다른 회원 행세를 할 수 있다.
name: ticket-edge

x-log: &log
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

x-app: &app
  network_mode: host
  restart: unless-stopped
  logging: *log

# Config Server에서 설정을 받는 서비스 공통 값. 설정 자체는 backend/config-repo에 있고 config-server 이미지에 들어 있다.
x-client-env: &client-env
  # 서비스 jar의 기본 프로필은 local이고 local은 ddl-auto: create라 기동할 때마다 테이블을 지운다. 서버는 반드시 dev로 띄운다.
  SPRING_PROFILES_ACTIVE: dev
  CONFIG_SERVER_URL: http://localhost:8888
  EUREKA_URL: http://localhost:8761/eureka
  EUREKA_PREFER_IP: "true"
  # host 네트워크에는 docker0(172.17.x) 같은 다른 인터페이스도 보인다. 그 IP가 등록되면 다른 서버에서 닿지 않으므로 VPC IP를 직접 적는다.
  EUREKA_INSTANCE_IPADDRESS: ${EDGE_IP:?EDGE_IP가 필요하다}
  DB_HOST: ${DATA_IP:?DATA_IP가 필요하다}
  REDIS_HOST: ${DATA_IP}
  KAFKA_BOOTSTRAP_SERVERS: ${DATA_IP}:29092

x-health: &health
  test: ["CMD-SHELL", "curl -fs http://localhost:$${SERVER_PORT}/actuator/health > /dev/null"]
  interval: 10s
  timeout: 5s
  retries: 18
  start_period: 60s

x-after-platform: &after-platform
  config-server:
    condition: service_healthy
  eureka-server:
    condition: service_started

services:
  caddy:
    image: caddy:2.10.2-alpine
    network_mode: host
    restart: unless-stopped
    logging: *log
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN이 필요하다}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 프론트 빌드 결과(frontend/dist). 프론트를 다른 곳에 두기로 하면 Caddyfile의 정적 파일 부분과 함께 뺀다.
      - ${FRONTEND_DIST:-../frontend/dist}:/srv/frontend:ro
      # 발급받은 인증서. 지우면 다시 발급받아야 하고, 자주 지우면 Let's Encrypt 발급 한도에 걸린다.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway-service:
        condition: service_started

  config-server:
    <<: *app
    image: ${ECR_REGISTRY:?ECR_REGISTRY가 필요하다}/ticket/config-server:${IMAGE_TAG:?IMAGE_TAG가 필요하다}
    environment:
      SERVER_PORT: "8888"
      JAVA_OPTS: "-Xms64m -Xmx192m"
    healthcheck: *health

  eureka-server:
    <<: *app
    image: ${ECR_REGISTRY}/ticket/eureka-server:${IMAGE_TAG}
    environment:
      SERVER_PORT: "8761"
      JAVA_OPTS: "-Xms64m -Xmx192m"

  gateway-service:
    <<: *app
    image: ${ECR_REGISTRY}/ticket/gateway-service:${IMAGE_TAG}
    environment:
      <<: *client-env
      SERVER_PORT: "8080"
      JAVA_OPTS: "-Xms128m -Xmx384m"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET이 필요하다}
      QUEUE_TOKEN_SECRET: ${QUEUE_TOKEN_SECRET:?QUEUE_TOKEN_SECRET이 필요하다}
    healthcheck: *health
    depends_on: *after-platform

  user-service:
    <<: *app
    image: ${ECR_REGISTRY}/ticket/user-service:${IMAGE_TAG}
    environment:
      <<: *client-env
      SERVER_PORT: "8081"
      JAVA_OPTS: "-Xms128m -Xmx384m"
      JWT_SECRET: ${JWT_SECRET}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD가 필요하다}
      MASTER_EMAIL: ${MASTER_EMAIL:-}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-}
    healthcheck: *health
    depends_on: *after-platform

  performance-service:
    <<: *app
    image: ${ECR_REGISTRY}/ticket/performance-service:${IMAGE_TAG}
    environment:
      <<: *client-env
      SERVER_PORT: "8082"
      JAVA_OPTS: "-Xms128m -Xmx512m"
      PERFORMANCE_DB_PASSWORD: ${PERFORMANCE_DB_PASSWORD:?PERFORMANCE_DB_PASSWORD가 필요하다}
    healthcheck: *health
    depends_on: *after-platform

  # 대기열은 예매(vm-core)와 CPU를 나눠 쓰지 않게 vm-edge에 둔다(#298). Redis만 쓴다.
  waiting-room-service:
    <<: *app
    image: ${ECR_REGISTRY}/ticket/waiting-room-service:${IMAGE_TAG}
    environment:
      <<: *client-env
      SERVER_PORT: "8085"
      JAVA_OPTS: "-Xms128m -Xmx384m"
      QUEUE_TOKEN_SECRET: ${QUEUE_TOKEN_SECRET}
    healthcheck: *health
    depends_on: *after-platform

volumes:
  caddy-data:
  caddy-config:
