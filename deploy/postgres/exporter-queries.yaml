# postgres-exporter가 기본 지표에 더해 수집하는 진단 쿼리. 로컬 통합시험 수집기(infra/integration/observe.py)와 같은 내용이다.
# 지표 이름은 <이름>_<열>이다. 예) ticket_pg_activity_sessions

# 서비스 계정·상태·대기 종류별 세션 수. 커넥션 풀이 DB에서 무엇을 기다리는지 본다
ticket_pg_activity:
  query: >-
    SELECT usename AS account, coalesce(wait_event_type, 'none') AS wait_type, coalesce(wait_event, 'none') AS wait_event,
           coalesce(state, 'none') AS state, count(*) AS sessions
    FROM pg_stat_activity
    WHERE backend_type = 'client backend' AND pid <> pg_backend_pid()
    GROUP BY 1, 2, 3, 4
  metrics:
    - account: {usage: LABEL, description: "DB 계정(서비스)"}
    - wait_type: {usage: LABEL, description: "대기 종류"}
    - wait_event: {usage: LABEL, description: "대기 이벤트"}
    - state: {usage: LABEL, description: "세션 상태"}
    - sessions: {usage: GAUGE, description: "세션 수"}

ticket_pg_xact:
  query: "SELECT coalesce(max(extract(epoch FROM now() - xact_start)), 0) AS oldest_seconds FROM pg_stat_activity WHERE pid <> pg_backend_pid()"
  metrics:
    - oldest_seconds: {usage: GAUGE, description: "가장 오래 열린 트랜잭션의 나이(초)"}

ticket_pg_locks:
  query: "SELECT count(*) AS blocked_sessions FROM pg_stat_activity WHERE cardinality(pg_blocking_pids(pid)) > 0"
  metrics:
    - blocked_sessions: {usage: GAUGE, description: "다른 세션의 잠금을 기다리는 세션 수"}

ticket_pg_wal:
  query: "SELECT wal_bytes AS bytes FROM pg_stat_wal"
  metrics:
    - bytes: {usage: COUNTER, description: "누적 WAL 생성량"}

# 서비스 계정별 SQL 호출 수와 누적 실행 시간. 증가율로 본다(p99가 아니다)
ticket_pg_statements:
  query: >-
    SELECT r.rolname AS account, sum(s.calls)::float8 AS calls, (sum(s.total_exec_time) / 1000)::float8 AS exec_seconds
    FROM pg_stat_statements s JOIN pg_roles r ON r.oid = s.userid
    GROUP BY r.rolname
  metrics:
    - account: {usage: LABEL, description: "DB 계정(서비스)"}
    - calls: {usage: COUNTER, description: "누적 SQL 호출 수"}
    - exec_seconds: {usage: COUNTER, description: "누적 SQL 실행 시간(초)"}
