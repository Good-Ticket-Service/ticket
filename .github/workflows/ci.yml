name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      # 컴파일, 단위 테스트, Testcontainers 통합 테스트(PostgreSQL)를 모두 돌린다. 러너에 Docker가 있다.
      - name: Build and test
        run: ./gradlew --no-daemon --continue build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-reports
          path: |
            backend/**/build/reports/tests/
            backend/**/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # .env.example은 로컬 전용 값이라 CI에서 그대로 쓴다.
      - name: Prepare .env
        run: cp .env.example .env
      - name: Start services
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Smoke test
        run: script/smoke.sh
      - name: Show service status on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150
      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans

  build-and-smoke:
    if: always()
    needs: [quality, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all verification jobs to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$SMOKE_RESULT" = success
