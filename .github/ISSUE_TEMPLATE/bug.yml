name: 버그
description: 기대와 다르게 동작하는 문제
title: "fix(<scope>): "
body:
  - type: input
    id: scope
    attributes:
      label: scope
      description: 문제가 난 모듈 (user, event, reservation, payment, gateway, config, eureka, common, infra)
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 현재 동작
      description: 실제로 일어난 일. 오류 응답의 status·code, 로그 한두 줄
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 요청·명령·데이터 조건. 동시성 문제면 동시 요청 수와 시나리오
      value: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      description: 브랜치·커밋, 로컬 Compose / IDE / CI
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      value: |
        - [ ] 재현 테스트가 수정 전에는 실패하고 수정 후에는 통과
        - [ ] `cd backend && ./gradlew build` 통과
    validations:
      required: true
