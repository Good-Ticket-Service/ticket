# payment 경보 단위 시험. 실행: promtool test rules infra/prometheus/tests/payment-alerts.test.yml
# 시각 경계는 평가 주기(15초)에 맞춰 직전·직후를 본다. 스냅샷 성공 시각은 시험 시각과 같이 늘려 항상 신선하게 둔다.
rule_files:
  - ../rules/payment-recording.yml
  - ../rules/payment-alerts.yml
evaluation_interval: 15s
tests:
  # 환불 최초 기록 나이 5분 WARNING, 15분 CRITICAL. 인스턴스 2대가 같은 값을 내도 한 번만 센다.
  - name: refund-aging-boundaries-and-dedup
    interval: 15s
    input_series:
      - series: 'payment_observation_last_success_timestamp_seconds{application="payment-service",instance="a"}'
        values: '0+15x80'
      - series: 'payment_observation_last_success_timestamp_seconds{application="payment-service",instance="b"}'
        values: '0+15x80'
      - series: 'payment_db_refunds_oldest_record_age_seconds{application="payment-service",instance="a",provider="TOSS",status="REQUESTED",mode="ACTIVE",reason="USER_CANCEL"}'
        values: '0+15x80'
      - series: 'payment_db_refunds_oldest_record_age_seconds{application="payment-service",instance="b",provider="TOSS",status="REQUESTED",mode="ACTIVE",reason="USER_CANCEL"}'
        values: '0+15x80'
      - series: 'payment_db_refunds_pending{application="payment-service",instance="a",provider="TOSS",status="REQUESTED",mode="ACTIVE",reason="USER_CANCEL"}'
        values: '3+0x80'
      - series: 'payment_db_refunds_pending{application="payment-service",instance="b",provider="TOSS",status="REQUESTED",mode="ACTIVE",reason="USER_CANCEL"}'
        values: '3+0x80'
      - series: 'payment_db_refunds_exposure_won{application="payment-service",instance="a",provider="TOSS",status="REQUESTED",mode="ACTIVE",reason="USER_CANCEL"}'
        values: '135000+0x80'
      - series: 'payment_db_refunds_exposure_won{application="payment-service",instance="b",provider="TOSS",status="REQUESTED",mode="ACTIVE",reason="USER_CANCEL"}'
        values: '135000+0x80'
    promql_expr_test:
      - expr: sum(payment:refunds_pending:max)
        eval_time: 1m
        exp_samples:
          - labels: '{}'
            value: 3
    alert_rule_test:
      - eval_time: 4m45s
        alertname: PaymentRefundAging
        exp_alerts: []
      - eval_time: 5m
        alertname: PaymentRefundAging
        exp_alerts:
          - exp_labels: {severity: warning, application: payment-service, provider: TOSS}
            exp_annotations:
              summary: "환불 지연 5분 초과"
              category: "환불 · TOSS"
              detail: "미완료 3건 · 135000원 · 최장 5m 0s"
              action: "자동 조회·재시도 진행 중 (조치 불필요)"
      - eval_time: 14m45s
        alertname: PaymentRefundAging
        exp_alerts:
          - exp_labels: {severity: warning, application: payment-service, provider: TOSS}
            exp_annotations:
              summary: "환불 지연 5분 초과"
              category: "환불 · TOSS"
              detail: "미완료 3건 · 135000원 · 최장 14m 45s"
              action: "자동 조회·재시도 진행 중 (조치 불필요)"
      - eval_time: 15m
        alertname: PaymentRefundAging
        exp_alerts:
          - exp_labels: {severity: warning, application: payment-service, provider: TOSS}
            exp_annotations:
              summary: "환불 지연 5분 초과"
              category: "환불 · TOSS"
              detail: "미완료 3건 · 135000원 · 최장 15m 0s"
              action: "자동 조회·재시도 진행 중 (조치 불필요)"
          - exp_labels: {severity: critical, application: payment-service, provider: TOSS}
            exp_annotations:
              summary: "환불 지연 15분 초과"
              category: "환불 · TOSS"
              detail: "미완료 3건 · 135000원 · 최장 15m 0s"
              action: "PG 상태·마지막 확인 시각 점검 (60분 후 저빈도 조회 전환)"

  # 집계가 멈춘 인스턴스의 오래된 값은 경보 근거로 쓰지 않는다. 대신 관측 노후 경보가 뜬다.
  - name: stale-snapshot-is-not-evidence
    interval: 15s
    input_series:
      - series: 'payment_observation_last_success_timestamp_seconds{application="payment-service",instance="a"}'
        values: '0+0x80'
      - series: 'payment_observation_success{application="payment-service",instance="a"}'
        values: '0+0x80'
      - series: 'payment_db_refunds_oldest_record_age_seconds{application="payment-service",instance="a",provider="TOSS",status="REQUESTED",mode="ACTIVE",reason="USER_CANCEL"}'
        values: '3600+0x80'
    alert_rule_test:
      - eval_time: 10m
        alertname: PaymentRefundAging
        exp_alerts: []
      - eval_time: 10m
        alertname: PaymentObservationStale
        exp_alerts:
          - exp_labels: {severity: warning, application: payment-service, instance: a}
            exp_annotations:
              summary: "결제 DB 집계 중단"
              category: "모니터링"
              detail: "미완료 건수·금액 지표 1분 이상 미갱신"
              action: "관측 경로 우선 점검 (0건 표시도 정상 아님)"

  - name: restricted-refunds
    interval: 15s
    input_series:
      - series: 'payment_observation_last_success_timestamp_seconds{application="payment-service",instance="a"}'
        values: '0+15x20'
      - series: 'payment_db_refunds_restricted{application="payment-service",instance="a",provider="KAKAO",cause="inconsistent"}'
        values: '1+0x20'
      - series: 'payment_db_refunds_restricted{application="payment-service",instance="a",provider="KAKAO",cause="declined"}'
        values: '2+0x20'
      - series: 'payment_db_refunds_restricted{application="payment-service",instance="a",provider="TOSS",cause="verification"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 1m
        alertname: PaymentRefundInconsistent
        exp_alerts:
          - exp_labels: {severity: critical, application: payment-service, provider: KAKAO}
            exp_annotations:
              summary: "환불 거래·금액 불일치"
              category: "환불 · KAKAO"
              detail: "자동 취소 중단 1건"
              action: "운영 조회로 원거래·금액 확인"
      - eval_time: 1m
        alertname: PaymentRefundNeedsOperator
        exp_alerts:
          - exp_labels: {severity: warning, application: payment-service, provider: KAKAO}
            exp_annotations:
              summary: "운영 확인 필요 환불"
              category: "환불 · KAKAO"
              detail: "조회 전용·운영 중단 2건"
              action: "운영 조회 후 재개(unblock) 또는 재시도(retry) 결정"

  # 실행 시각이 지난 작업만 센다(게이지가 이미 미래 예약을 제외한다). 1분 WARNING, 5분 CRITICAL.
  - name: job-overdue
    interval: 15s
    input_series:
      - series: 'payment_observation_last_success_timestamp_seconds{application="payment-service",instance="a"}'
        values: '0+15x40'
      - series: 'payment_db_jobs_oldest_due_age_seconds{application="payment-service",instance="a",task="refund"}'
        values: '0+15x40'
      - series: 'payment_db_jobs_due{application="payment-service",instance="a",task="refund"}'
        values: '7+0x40'
      - series: 'payment_db_jobs_oldest_due_age_seconds{application="payment-service",instance="a",task="recovery"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 45s
        alertname: PaymentJobOverdue
        exp_alerts: []
      - eval_time: 1m
        alertname: PaymentJobOverdue
        exp_alerts:
          - exp_labels: {severity: warning, application: payment-service, task: refund}
            exp_annotations:
              summary: "refund 작업 지연 1분 초과"
              category: "결제 · 잡"
              detail: "대기 7건 · 최장 1m 0s"
              action: "PG 지연·스케줄러·DB 병목 점검"
      - eval_time: 5m
        alertname: PaymentJobOverdue
        exp_alerts:
          - exp_labels: {severity: warning, application: payment-service, task: refund}
            exp_annotations:
              summary: "refund 작업 지연 1분 초과"
              category: "결제 · 잡"
              detail: "대기 7건 · 최장 5m 0s"
              action: "PG 지연·스케줄러·DB 병목 점검"
          - exp_labels: {severity: critical, application: payment-service, task: refund}
            exp_annotations:
              summary: "refund 작업 지연 5분 초과"
              category: "결제 · 잡"
              detail: "대기 7건 · 최장 5m 0s"
              action: "PG 지연·스케줄러·DB 병목 점검"

  # 켜진 역할만 정지로 본다. 다른 인스턴스(b)가 refund를 맡지 않아 마지막 성공이 0이어도 경보하지 않는다.
  - name: job-stalled-only-for-enabled-role
    interval: 15s
    input_series:
      - series: 'payment_job_enabled{application="payment-service",instance="a",task="refund"}'
        values: '1+0x60'
      - series: 'payment_job_enabled{application="payment-service",instance="b",task="refund"}'
        values: '0+0x60'
      - series: 'payment_job_last_success_timestamp_seconds{application="payment-service",instance="a",task="refund"}'
        values: '0+15x20 300+0x40'
      - series: 'payment_job_last_success_timestamp_seconds{application="payment-service",instance="b",task="refund"}'
        values: '0+0x60'
      - series: 'payment_job_enabled{application="payment-service",instance="a",task="reconcile"}'
        values: '0+0x60'
      - series: 'payment_job_last_success_timestamp_seconds{application="payment-service",instance="a",task="reconcile"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: PaymentJobStalled
        exp_alerts: []
      - eval_time: 12m
        alertname: PaymentJobStalled
        exp_alerts:
          - exp_labels: {severity: critical, application: payment-service, task: refund}
            exp_annotations:
              summary: "refund 잡 정지"
              category: "결제 · 잡"
              detail: "마지막 정상 실행 7m 0s 전"
              action: "잡 실행 실패·멈춤·DB 장애 점검"

  - name: target-missing
    interval: 15s
    input_series:
      - series: 'up{application="user-service",instance="u"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 30s
        alertname: PaymentTargetMissing
        exp_alerts: []
      - eval_time: 2m
        alertname: PaymentTargetMissing
        exp_alerts:
          - exp_labels: {severity: critical, application: payment-service}
            exp_annotations:
              summary: "payment-service 수집 불가"
              category: "모니터링"
              detail: "수집 대상 없음 또는 전체 다운"
              action: "서비스 상태·Eureka 등록 점검 (다른 결제 경보 억제 중)"

  # 실패율 20% 초과 + 2분 최소 20건 + 2분 지속. 표본이 적으면 실패율이 높아도 경보하지 않는다.
  - name: pg-degraded-with-minimum-samples
    interval: 15s
    input_series:
      - series: 'payment_pg_http_duration_seconds_count{application="payment-service",instance="a",provider="TOSS",operation="approve",outcome="2xx"}'
        values: '0+5x60'
      - series: 'payment_pg_http_duration_seconds_count{application="payment-service",instance="a",provider="TOSS",operation="approve",outcome="5xx"}'
        values: '0+5x60'
      - series: 'payment_pg_http_duration_seconds_count{application="payment-service",instance="a",provider="KAKAO",operation="cancel",outcome="5xx"}'
        values: '0+0x20 1+0x40'
      - series: 'payment_pg_http_duration_seconds_count{application="payment-service",instance="a",provider="KAKAO",operation="cancel",outcome="4xx"}'
        values: '0+5x60'
    alert_rule_test:
      - eval_time: 8m
        alertname: PaymentPgDegraded
        exp_alerts:
          - exp_labels: {severity: warning, application: payment-service, provider: TOSS, operation: approve}
            exp_annotations:
              summary: "PG 호출 실패율 20% 초과"
              category: "PG · TOSS"
              detail: "approve 실패율 50% (5xx·429·응답 유실·연결 실패, 4xx 제외)"
              action: "PG 상태 확인 (결과 불명은 복구 잡이 조회로 확정)"
