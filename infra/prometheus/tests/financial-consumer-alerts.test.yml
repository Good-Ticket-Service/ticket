rule_files:
  - ../rules/financial-consumer-alerts.yml
evaluation_interval: 1m
tests:
  - name: unresolved-incident-survives-recent-counter-window-and-clears-only-after-resolution
    interval: 1m
    input_series:
      - series: 'settlement_consumer_incidents_unresolved{application="payment-service",instance="a",stage="POSTING"}'
        values: '0 1+0x10 0+0x3'
    alert_rule_test:
      - eval_time: 1m
        alertname: FinancialConsumerIncidentOpen
        exp_alerts: []
      - eval_time: 10m
        alertname: FinancialConsumerIncidentOpen
        exp_alerts:
          - exp_labels:
              severity: warning
              application: payment-service
              stage: POSTING
            exp_annotations:
              summary: "금융 Consumer 미해결 격리 이력"
              category: "정산 · Consumer 운영"
              dashboard_url: ""
              action: |-
                1. 장애 조회 (MASTER 인증)
                GET /api/admin/settlements/consumers/incidents?status=OPEN

                2. 원인 수정 후 재처리 (commandId: UUID, reason: 조치 사유)
                POST /api/admin/settlements/consumers/incidents/{incidentId}/replay

                3. 명령 DONE 및 장애 해소 확인
                GET /api/admin/settlements/consumers/commands/{commandId}

                원천 불명 poison: 생산자 확인 후 사유를 남겨 해소
                POST /api/admin/settlements/consumers/incidents/{incidentId}/resolve

                주의: 원장·금액·offset 직접 수정 금지. 별도 관리 화면 없이 API로 조치.
      - eval_time: 12m
        alertname: FinancialConsumerIncidentOpen
        exp_alerts: []
