# 메시지 승인 실패는 금융 결과와 구분한다. 원본/인증값/주문 ID를 라벨로 쓰지 않는다.
groups:
  - name: payment-confirm-alerts
    rules:
      # DLT 송신 성공도 사람의 확인이 필요하다. 해제는 최근 발생 창 종료이며 개별 건 조치 완료가 아니다.
      - alert: PaymentConfirmPoisonMessageQuarantined
        expr: sum by (application) (increase(payment_confirm_records_total{application="payment-service",outcome="dlt_sent"}[5m])) > 0
        labels:
          severity: warning
          application: payment-service
        annotations:
          summary: "승인 요청 poison message DLT 격리"
          category: "결제 · Kafka"
          detail: "최근 5분 DLT 격리 발생. 중복 송신이 포함될 수 있으며 해제는 개별 건 조치 완료를 뜻하지 않는다."
          action: "마스킹 DLT의 원본 좌표로 생산자 형식·버전을 점검하고 현재 결제·예매 상태와 최초 승인 시한을 확인한다. 시한 연장·원문 인증값 공유·무조건 재발행을 하지 않는다."
      - alert: PaymentConfirmOperationPaused
        expr: payment_confirm_paused > 0
        for: 30s
        labels:
          severity: warning
          application: payment-service
        annotations:
          summary: "승인 Consumer 운영 인수 필요"
          action: "고정 오류 분류와 원본 좌표·현재 금융 상태를 확인한다. 원인 제거 후 재기동하며 시한을 연장하거나 원본 offset을 임의로 넘기지 않는다."
      - alert: PaymentConfirmWaitingTooLong
        expr: payment_confirm_oldest_seconds > 60
        for: 1m
        labels:
          severity: warning
          application: payment-service
        annotations:
          summary: "승인 메시지 처리 대기 장기화"
          action: "PG별 한도·서킷·worker·DB와 남은 승인 시한을 확인한다. 미전송 대기를 결과 불명 60초로 해석하지 않는다."
      - alert: PaymentConfirmDeadLetterDeliveryFailed
        expr: increase(payment_confirm_records_total{outcome="dlt_failed"}[5m]) > 0
        labels:
          severity: warning
          application: payment-service
        annotations:
          summary: "승인 DLT 전달 실패"
          action: "브로커·권한·토픽 상태를 확인한다. DLT 송신 확인 전 원본 offset을 넘기지 않는다."
