# payment 위험 경보. Alertmanager가 묶어서 Slack으로 보낸다(infra/alertmanager/alertmanager.yml).
#
# - 임계값은 초기 운영안이다. 업계 표준이 아니며 기준선 측정(#120) 뒤 조정한다.
# - 같은 위험의 WARNING·CRITICAL은 alertname을 같게 두어 Alertmanager가 CRITICAL이 뜨면 WARNING을 억제한다.
# - 거래·회원 ID나 오류 원문을 라벨·주석에 넣지 않는다. 개별 거래는 운영 조회에서 찾는다.
# - 해소 알림은 위험 조건이 풀렸다는 뜻이다. 고객 실제 입금이나 전체 금융 대조 완료를 뜻하지 않는다.
groups:
  - name: payment-alerts
    interval: 15s
    rules:
      # 미완료 환불의 최초 기록 나이. SLOW(60분부터 저빈도 조회)로 넘어간 환불도 미완료라 계속 CRITICAL로 남는다.
      - alert: PaymentRefundAging
        expr: max by (provider) (payment:refunds_oldest_record_age_seconds:max) >= 300
        labels:
          severity: warning
          application: payment-service
        annotations:
          summary: "환불 지연 5분 초과"
          category: "환불 · {{ $labels.provider }}"
          detail: "미완료 {{ with printf \"sum(payment:refunds_pending:max{provider='%s'}) or vector(0)\" $labels.provider | query }}{{ . | first | value | printf \"%.0f\" }}{{ end }}건 · {{ with printf \"sum(payment:refunds_exposure_won:max{provider='%s'}) or vector(0)\" $labels.provider | query }}{{ . | first | value | printf \"%.0f\" }}{{ end }}원 · 최장 {{ $value | humanizeDuration }}"
          action: "자동 조회·재시도 진행 중 (조치 불필요)"
      - alert: PaymentRefundAging
        expr: max by (provider) (payment:refunds_oldest_record_age_seconds:max) >= 900
        labels:
          severity: critical
          application: payment-service
        annotations:
          summary: "환불 지연 15분 초과"
          category: "환불 · {{ $labels.provider }}"
          detail: "미완료 {{ with printf \"sum(payment:refunds_pending:max{provider='%s'}) or vector(0)\" $labels.provider | query }}{{ . | first | value | printf \"%.0f\" }}{{ end }}건 · {{ with printf \"sum(payment:refunds_exposure_won:max{provider='%s'}) or vector(0)\" $labels.provider | query }}{{ . | first | value | printf \"%.0f\" }}{{ end }}원 · 최장 {{ $value | humanizeDuration }}"
          action: "PG 상태·마지막 확인 시각 점검 (60분 후 저빈도 조회 전환)"

      # 다른 원거래·금액·취소 가능액이 맞지 않아 자동 실행을 멈춘 환불. DB에 남은 상태라 scrape 사이에 사라지지 않는다.
      - alert: PaymentRefundInconsistent
        expr: sum by (provider) (payment:refunds_restricted:max{cause="inconsistent"}) > 0
        labels:
          severity: critical
          application: payment-service
        annotations:
          summary: "환불 거래·금액 불일치"
          category: "환불 · {{ $labels.provider }}"
          detail: "자동 취소 중단 {{ $value | printf \"%.0f\" }}건"
          action: "운영 조회로 원거래·금액 확인"

      # 조회 전용(VERIFY_ONLY)이나 운영 중단(PAUSED)으로 사람의 확인이 필요한 환불
      - alert: PaymentRefundNeedsOperator
        expr: sum by (provider) (payment:refunds_restricted:max{cause!="inconsistent"}) > 0
        labels:
          severity: warning
          application: payment-service
        annotations:
          summary: "운영 확인 필요 환불"
          category: "환불 · {{ $labels.provider }}"
          detail: "조회 전용·운영 중단 {{ $value | printf \"%.0f\" }}건"
          action: "운영 조회 후 재개(unblock) 또는 재시도(retry) 결정"

      # 실행 시각이 지났는데 처리하지 않은 작업. 정상 SLOW 예약 대기(미래 시각)는 들어가지 않는다.
      - alert: PaymentJobOverdue
        expr: max by (task) (payment:jobs_oldest_due_age_seconds:max) >= 60
        labels:
          severity: warning
          application: payment-service
        annotations:
          summary: "{{ $labels.task }} 작업 지연 1분 초과"
          category: "결제 · 잡"
          detail: "대기 {{ with printf \"max(payment:jobs_due:max{task='%s'}) or vector(0)\" $labels.task | query }}{{ . | first | value | printf \"%.0f\" }}{{ end }}건 · 최장 {{ $value | humanizeDuration }}"
          action: "PG 지연·스케줄러·DB 병목 점검"
      - alert: PaymentJobOverdue
        expr: max by (task) (payment:jobs_oldest_due_age_seconds:max) >= 300
        labels:
          severity: critical
          application: payment-service
        annotations:
          summary: "{{ $labels.task }} 작업 지연 5분 초과"
          category: "결제 · 잡"
          detail: "대기 {{ with printf \"max(payment:jobs_due:max{task='%s'}) or vector(0)\" $labels.task | query }}{{ . | first | value | printf \"%.0f\" }}{{ end }}건 · 최장 {{ $value | humanizeDuration }}"
          action: "PG 지연·스케줄러·DB 병목 점검"

      # 켜져 있는 잡의 마지막 정상 실행이 오래됐다. 0건 정상 실행도 성공으로 기록되므로 할 일이 없어서 생기는 경보가 아니다.
      # 꺼진 역할(enabled=0)은 제외한다. 300초는 가장 긴 실행 주기(reconcile 1분)와 실행 예산을 감안한 초기값이다.
      - alert: PaymentJobStalled
        expr: |
          (time() - max by (task) (payment_job_last_success_timestamp_seconds{application="payment-service"})) > 300
          and on (task) max by (task) (payment_job_enabled{application="payment-service"}) == 1
        for: 1m
        labels:
          severity: critical
          application: payment-service
        annotations:
          summary: "{{ $labels.task }} 잡 정지"
          category: "결제 · 잡"
          detail: "마지막 정상 실행 {{ $value | humanizeDuration }} 전"
          action: "잡 실행 실패·멈춤·DB 장애 점검"

      # DB 집계가 실패하거나 오래됐다. 이때 업무 경보는 판단 근거가 없으므로 관측 경로부터 확인한다.
      - alert: PaymentObservationStale
        expr: |
          (time() - payment_observation_last_success_timestamp_seconds{application="payment-service"}) > 60
          or payment_observation_success{application="payment-service"} == 0
        for: 1m
        labels:
          severity: warning
          application: payment-service
        annotations:
          summary: "결제 DB 집계 중단"
          category: "모니터링"
          detail: "미완료 건수·금액 지표 1분 이상 미갱신"
          action: "관측 경로 우선 점검 (0건 표시도 정상 아님)"

      # payment 타깃이 아예 없거나 모두 내려갔다. Eureka에서 사라지면 up 시계열도 없어지므로 absent로 함께 본다.
      - alert: PaymentTargetMissing
        expr: |
          absent(up{application="payment-service"})
          or sum(up{application="payment-service"}) == 0
        for: 1m
        labels:
          severity: critical
          application: payment-service
        annotations:
          summary: "payment-service 수집 불가"
          category: "모니터링"
          detail: "수집 대상 없음 또는 전체 다운"
          action: "서비스 상태·Eureka 등록 점검 (다른 결제 경보 억제 중)"

      # PG HTTP 실패 비율. 2분 동안 최소 20건 이상일 때만 판단해 적은 표본의 튐을 장애로 보지 않는다.
      - alert: PaymentPgDegraded
        expr: |
          (payment:pg_http_failures:rate2m / payment:pg_http_requests:rate2m) > 0.2
          and payment:pg_http_requests:rate2m * 120 >= 20
        for: 2m
        labels:
          severity: warning
          application: payment-service
        annotations:
          summary: "PG 호출 실패율 20% 초과"
          category: "PG · {{ $labels.provider }}"
          detail: "{{ $labels.operation }} 실패율 {{ $value | humanizePercentage }} (5xx·429·응답 유실·연결 실패, 4xx 제외)"
          action: "PG 상태 확인 (결과 불명은 복구 잡이 조회로 확정)"

  - name: alerting-pipeline
    interval: 15s
    rules:
      # Alertmanager가 Slack에 보내지 못했다. 이 경보 자체도 Slack으로 못 갈 수 있으므로 대시보드·로그로도 확인한다.
      - alert: AlertmanagerNotificationsFailing
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total{application="alertmanager"}[5m])) > 0
        labels:
          severity: warning
          application: alertmanager
        annotations:
          summary: "{{ $labels.integration }} 알림 전송 실패"
          category: "모니터링"
          detail: "최근 5분 실패 {{ $value | printf \"%.0f\" }}회 (금융 처리 영향 없음)"
          action: "webhook·네트워크·Slack 제한 점검"
