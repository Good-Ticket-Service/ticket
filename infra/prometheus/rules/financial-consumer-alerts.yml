groups:
  - name: financial-consumer-alerts
    rules:
      - alert: FinancialConsumerIncidentOpen
        expr: max by (application, stage) (settlement_consumer_incidents_unresolved{application="payment-service"}) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "금융 Consumer 미해결 격리 이력"
          category: "정산 · Consumer 운영"
          dashboard_url: '{{ with $externalLabels.payment_dashboard_url }}{{ . }}{{ end }}'
          action: |-
            1. 장애 조회 (MASTER 인증)
            GET /api/admin/settlements/consumers/incidents?status=OPEN

            2. 원인 수정 후 재처리 (commandId: UUID, reason: 조치 사유)
            POST /api/admin/settlements/consumers/incidents/{incidentId}/replay

            3. 명령 DONE 및 장애 해소 확인
            GET /api/admin/settlements/consumers/commands/{commandId}

            원천 불명 poison: 생산자 확인 후 사유를 남겨 해소
            POST /api/admin/settlements/consumers/incidents/{incidentId}/resolve

            주의: 원장·금액·offset 직접 수정 금지. 별도 관리 화면 없이 API로 조치.
      - alert: SettlementPostingFinancialLagging
        expr: max by (application) (settlement_posting_oldest_pending_seconds{application="payment-service"}) > 60
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "발행 여부와 무관한 금융 반영 대기 장기화"
          action: "Consumer·DB·broker·격리 이력을 확인한다. broker ACK와 lag0을 원장 반영 완료로 해석하지 않는다."
      - alert: FinancialConsumerReplayWaiting
        expr: max by (application) (settlement_consumer_replay_pending{application="payment-service"}) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "금융 재처리 명령 미완료"
          action: "명령 상태·발행기·Consumer를 확인한다. PUBLISHED는 DONE이 아니며 같은 commandId로 상태를 조회한다."
      - alert: FinancialConsumerObservationFailed
        expr: sum by (application) (increase(settlement_consumer_observation_errors_total{application="payment-service"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "금융 Consumer 운영 관측 실패"
          action: "DB 연결과 마지막 정상 관측 시각을 확인한다. 관측 실패를 미해결 0건으로 해석하지 않는다."
      - alert: SettlementProjectionConsumerStopped
        expr: max by (application) (payment_settlement_projection_consumer_stopped{application="payment-service"}) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "집계 Consumer 중지"
          action: "고정 오류 사유와 미해결 incident를 확인한다. 원인 수정 후 재기동하거나 검증된 새 세대로 전환하며 offset을 임의로 넘기지 않는다."
