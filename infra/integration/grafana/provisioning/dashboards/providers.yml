apiVersion: 1
providers:
  - name: Integration
    orgId: 1
    folder: Integration
    type: file
    disableDeletion: false
    updateIntervalSeconds: 15
    options:
      path: /var/lib/grafana/integration-dashboards
  - name: Payment
    orgId: 1
    folder: Payment
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/payment-dashboards
