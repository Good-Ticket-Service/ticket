global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels: {environment: integration-local}
rule_files: [/etc/prometheus/rules/*.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: integration-host
    scrape_interval: 15s
    static_configs:
      - targets: [host.docker.internal:19100]
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: spring-apps
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: http://eureka-server:8761/eureka
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application
        action: lowercase
      - source_labels: [__meta_eureka_app_instance_id]
        target_label: instance
  - job_name: fake-pg
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [fake-pg:8090]
        labels: {application: fake-pg}
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
        labels: {application: postgres}
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
