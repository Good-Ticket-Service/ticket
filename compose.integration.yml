# 별도 develop worktree의 docker-compose.yml과 병합한다. 실행 진입점: infra/integration/compose.py
# CPU 번호는 Docker Linux VM의 논리 CPU다. 같은 서버 묶음이 같은 CPU를 공유한다.
x-log: &log
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-edge: &edge
  cpuset: ${INTEGRATION_EDGE_CPUS:-0-1}
  logging: *log
  labels: {ticket.integration.group: edge}
x-core: &core
  cpuset: ${INTEGRATION_CORE_CPUS:-2-3}
  logging: *log
  labels: {ticket.integration.group: core}
x-data: &data
  cpuset: ${INTEGRATION_DATA_CPUS:-4-5}
  logging: *log
  labels: {ticket.integration.group: data}
x-env: &env
  SPRING_PROFILES_ACTIVE: integration
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "10"
  SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HIKARICP_CONNECTIONS_ACQUIRE: "true"
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HIKARICP_CONNECTIONS_USAGE: "true"
  JAVA_OPTS: "-Xms128m -Xmx384m -XX:ActiveProcessorCount=2"
  # observability 프로필에서만 compose.py가 에이전트 옵션을 채운다. 비어 있으면 아래 OTEL_·PYROSCOPE_ 값은 읽히지 않는다.
  JAVA_TOOL_OPTIONS: ${INTEGRATION_OBSERVABILITY_JAVA_OPTS:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
  PYROSCOPE_FORMAT: jfr
  # Docker VM에서는 perf_events를 못 쓰므로 CPU 샘플은 itimer로 잡는다.
  PYROSCOPE_PROFILER_EVENT: itimer
  PYROSCOPE_PROFILER_ALLOC: 512k
  PYROSCOPE_PROFILER_LOCK: 10ms
x-agents: &agents ${INTEGRATION_AGENTS}:/agents:ro
x-observe: &observe
  profiles: [observability]
  cpuset: ${INTEGRATION_OBSERVABILITY_CPUS:-7}
  logging: *log
  labels: {ticket.integration.group: observability}
  networks: [ticket-net]
x-health: &health
  test: [CMD-SHELL, 'curl -fs http://localhost:$${SERVER_PORT}/actuator/health > /dev/null']
  interval: 10s
  timeout: 5s
  retries: 18
  start_period: 60s

services:
  caddy:
    <<: *edge
    image: caddy:2.10.2-alpine
    mem_limit: 256m
    ports: ["127.0.0.1:${INTEGRATION_ENTRY_PORT:-18080}:80"]
    volumes:
      - ${INTEGRATION_ASSETS}/Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [ticket-net]
    depends_on:
      gateway-service: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost/actuator/health]
      interval: 10s
      retries: 12

  config-server:
    <<: *edge
    image: ticket-integration/config-server:${INTEGRATION_SOURCE_SHA}
    mem_limit: 384m
    environment:
      JAVA_OPTS: "-Xms64m -Xmx192m -XX:ActiveProcessorCount=2"
  eureka-server:
    <<: *edge
    image: ticket-integration/eureka-server:${INTEGRATION_SOURCE_SHA}
    mem_limit: 384m
    environment:
      JAVA_OPTS: "-Xms64m -Xmx192m -XX:ActiveProcessorCount=2"
  gateway-service:
    <<: *edge
    image: ticket-integration/gateway-service:${INTEGRATION_SOURCE_SHA}
    mem_limit: 768m
    environment:
      <<: *env
      SERVER_PORT: "8080"
      OTEL_SERVICE_NAME: gateway-service
      PYROSCOPE_APPLICATION_NAME: gateway-service
    volumes: [*agents]
    healthcheck: *health
  user-service:
    <<: *edge
    image: ticket-integration/user-service:${INTEGRATION_SOURCE_SHA}
    mem_limit: 768m
    environment:
      <<: *env
      SERVER_PORT: "8081"
      OTEL_SERVICE_NAME: user-service
      PYROSCOPE_APPLICATION_NAME: user-service
    volumes: [*agents]
    healthcheck: *health
  performance-service:
    <<: *edge
    image: ticket-integration/performance-service:${INTEGRATION_SOURCE_SHA}
    mem_limit: 1g
    environment:
      <<: *env
      SERVER_PORT: "8082"
      OTEL_SERVICE_NAME: performance-service
      PYROSCOPE_APPLICATION_NAME: performance-service
      JAVA_OPTS: "-Xms128m -Xmx512m -XX:ActiveProcessorCount=2"
    volumes: [*agents]
    healthcheck: *health
  reservation-service:
    <<: *core
    image: ticket-integration/reservation-service:${INTEGRATION_SOURCE_SHA}
    mem_limit: 1792m
    environment:
      <<: *env
      SERVER_PORT: "8083"
      OTEL_SERVICE_NAME: reservation-service
      PYROSCOPE_APPLICATION_NAME: reservation-service
      # JFR과 누수 탐지는 observability 프로필에서만 compose.py가 켠다. 기본 실행의 측정 조건을 이전과 같게 둔다. 0은 누수 탐지 끔이다.
      SPRING_DATASOURCE_HIKARI_LEAKDETECTIONTHRESHOLD: ${INTEGRATION_LEAK_DETECTION_MS:-0}
      JAVA_OPTS: "-Xms256m -Xmx1g -XX:ActiveProcessorCount=2${INTEGRATION_JFR:+ -XX:FlightRecorderOptions:stackdepth=256 -XX:StartFlightRecording=disk=true,maxage=30m,maxsize=200m,dumponexit=true,filename=/jfr/reservation.jfr}"
    volumes:
      - ${INTEGRATION_RESULTS}/jfr:/jfr
      - *agents
    healthcheck: *health
  payment-service:
    <<: *core
    image: ticket-integration/payment-service:${INTEGRATION_SOURCE_SHA}
    mem_limit: 1792m
    environment:
      <<: *env
      SERVER_PORT: "8084"
      OTEL_SERVICE_NAME: payment-service
      PYROSCOPE_APPLICATION_NAME: payment-service
      SPRING_DATASOURCE_HIKARI_LEAKDETECTIONTHRESHOLD: ${INTEGRATION_LEAK_DETECTION_MS:-0}
      JAVA_OPTS: "-Xms256m -Xmx1g -XX:ActiveProcessorCount=2${INTEGRATION_JFR:+ -XX:FlightRecorderOptions:stackdepth=256 -XX:StartFlightRecording=disk=true,maxage=30m,maxsize=200m,dumponexit=true,filename=/jfr/payment.jfr}"
    volumes:
      - ${INTEGRATION_RESULTS}/jfr:/jfr
      - *agents
    healthcheck: *health
  fake-pg:
    <<: *data
    image: ticket-integration/fake-pg:${INTEGRATION_SOURCE_SHA}
    mem_limit: 768m
    environment:
      <<: *env
      SERVER_PORT: "8090"
      OTEL_SERVICE_NAME: fake-pg
      PYROSCOPE_APPLICATION_NAME: fake-pg
    volumes: [*agents]
    healthcheck: *health
  postgres:
    <<: *data
    mem_limit: 2g
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, shared_buffers=512MB, -c, track_io_timing=on]
    volumes:
      - ${INTEGRATION_ASSETS}/init-schemas.sh:/docker-entrypoint-initdb.d/zz-integration-schema.sh:ro
      - ${INTEGRATION_SOURCE}/backend/sql:/integration-sql:ro
  redis:
    <<: *data
    mem_limit: 384m
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: ["redis-data:/data"]
  kafka:
    <<: *data
    mem_limit: 768m
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m -XX:ActiveProcessorCount=2"
  kafka-ui:
    <<: *data
    profiles: [tools]
    mem_limit: 256m
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:ActiveProcessorCount=2"
  prometheus:
    <<: *data
    mem_limit: 512m
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=24h, --web.enable-remote-write-receiver]
    volumes:
      - ${INTEGRATION_ASSETS}/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  grafana:
    <<: *data
    # Grafana 13에서 256MiB는 memory.max 도달·reclaim 대기로 로그인까지 지연됐다.
    mem_limit: 512m
    volumes:
      - ${INTEGRATION_ASSETS}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${INTEGRATION_ASSETS}/grafana/dashboards:/var/lib/grafana/integration-dashboards:ro
      - ${INTEGRATION_ASSETS}/../grafana/provisioning/dashboards:/var/lib/grafana/payment-dashboards:ro
  redis-exporter:
    <<: *data
    image: oliver006/redis_exporter:v1.93.0
    mem_limit: 64m
    command: [--redis.addr=redis://redis:6379]
    networks: [ticket-net, ticket-data]
  kafka-exporter:
    <<: *data
    image: danielqsj/kafka-exporter:v1.9.0
    mem_limit: 128m
    command: [--kafka.server=kafka:29092]
    networks: [ticket-net, ticket-data]
  alertmanager:
    <<: *data
    mem_limit: 128m
  alert-mock:
    <<: *data
    mem_limit: 64m
  postgres-exporter:
    <<: *data
    image: prometheuscommunity/postgres-exporter:v0.16.0
    mem_limit: 96m
    environment:
      DATA_SOURCE_NAME: "postgresql://integration_metrics:integration_metrics_local_only@postgres:5432/ticket?sslmode=disable"
    networks: [ticket-net, ticket-data]
    depends_on:
      postgres: {condition: service_healthy}
  # 아래 넷은 COMPOSE_PROFILES=observability일 때만 뜬다. tempo는 trace, loki는 로그, alloy는 Docker 로그를 loki로 옮기고, pyroscope는 프로파일을 둔다.
  tempo:
    <<: *observe
    image: grafana/tempo:2.6.1
    mem_limit: 1g
    command: [-config.file=/etc/tempo.yaml]
    volumes:
      - ${INTEGRATION_ASSETS}/tempo.yaml:/etc/tempo.yaml:ro
  loki:
    <<: *observe
    image: grafana/loki:3.6.18
    mem_limit: 512m
    command: [-config.file=/etc/loki.yaml]
    volumes:
      - ${INTEGRATION_ASSETS}/loki.yaml:/etc/loki.yaml:ro
  alloy:
    <<: *observe
    image: grafana/alloy:v1.20.1
    mem_limit: 256m
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy]
    volumes:
      - ${INTEGRATION_ASSETS}/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
  pyroscope:
    <<: *observe
    image: grafana/pyroscope:2.4.1
    mem_limit: 1g
  k6:
    image: grafana/k6:0.54.0
    profiles: [load]
    cpuset: ${INTEGRATION_LOAD_CPUS:-6-7}
    mem_limit: 4g
    logging: *log
    labels: {ticket.integration.group: load}
    networks: [ticket-net]
    environment:
      BASE_URL: http://caddy
      FAKE_PG_URL: http://fake-pg:8090
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),max"
    volumes:
      - ${INTEGRATION_ASSETS}/k6:/scripts:ro
      - ${INTEGRATION_RESULTS}:/results
    command: [run, /scripts/connectivity.js]
    depends_on:
      caddy: {condition: service_healthy}

volumes:
  redis-data:
  prometheus-data:
