# Task 12 단독 환경용 수집 설정. Eureka가 없으므로 payment 인스턴스를 정적으로 적는다.
# 규칙·Alertmanager 설정은 실제 운영과 같은 파일(infra/prometheus/rules, infra/alertmanager)을 쓴다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: task12

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8084", "payment-service-2:8084"]
        labels:
          application: payment-service
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          application: alertmanager
