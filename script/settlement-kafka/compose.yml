name: ticket-settlement-kafka
services:
  promtool:
    image: prom/prometheus:v3.15.1
    pull_policy: never
    profiles: ["tools"]
    entrypoint: /bin/promtool
    working_dir: /etc/prometheus
    volumes: ["../../infra/prometheus:/etc/prometheus:ro"]
    network_mode: none
    read_only: true
    mem_limit: 128m
    tmpfs: ["/tmp"]
  postgres:
    image: postgres:16
    ports: ["127.0.0.1:15463:5432"]
    environment:
      POSTGRES_USER: sk363_admin
      POSTGRES_PASSWORD: sk363_local_fixture
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "track_io_timing=on"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sk363_admin -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.3.1
    ports: ["127.0.0.1:19063:19063"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:19063,INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://127.0.0.1:19063,INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    volumes: ["kafka-data:/var/lib/kafka/data"]
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20
volumes:
  postgres-data:
  kafka-data:
