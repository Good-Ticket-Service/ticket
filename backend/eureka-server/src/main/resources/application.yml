server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  # 로컬 개발용 값. 서비스를 자주 껐다 켜는 환경에서 죽은 인스턴스가 목록에 오래 남지 않게 한다.
  server:
    # Note: 자기 보호 모드는 갱신 신호가 한꺼번에 끊기면 네트워크 장애로 보고 인스턴스를 지우지 않는다.
    # 운영에서는 오판 삭제를 막아 주지만, 로컬에서는 내린 서비스가 계속 남아 Gateway가 죽은 주소로 요청을 보낸다.
    enable-self-preservation: false
    # 만료된 인스턴스를 정리하는 주기 (기본 60초)
    eviction-interval-timer-in-ms: 5000
    # 서버가 한 대뿐이라 다른 서버와 동기화할 목록을 기다리지 않는다 (기본 5분)
    wait-time-in-ms-when-sync-empty: 0
    # 목록 조회 응답을 30초마다 갱신하는 읽기 전용 캐시를 쓰지 않는다. 등록·해제·만료가 다음 조회에 바로 보인다.
    use-read-only-response-cache: false
