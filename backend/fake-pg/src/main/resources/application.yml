# Note: fake PG는 Config Server·Eureka를 쓰지 않는 바깥 시스템 흉내라서, 팀 서비스와 달리 설정을 이 파일에 직접 둔다.
# payment-service는 Eureka가 아니라 주소(pg.toss.base-url)로 찾아온다.
spring:
  application:
    name: fake-pg
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ticket?currentSchema=fake_pg_schema
    username: fake_pg_app
    password: ${FAKE_PG_DB_PASSWORD:fake_pg_local_pw}
  sql:
    init:
      # 기동할 때마다 schema.sql(IF NOT EXISTS)을 실행해 테이블을 만든다. Hibernate는 Entity와 맞는지만 검사한다.
      mode: always
      schema-locations: classpath:db/schema.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8090
  tomcat:
    threads:
      # 응답 유실 장애는 요청 스레드를 오래 붙잡는다. 부하 실험에서 fake PG 스레드가 먼저 바닥나지 않게 넉넉히 둔다.
      max: 400

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

fake-pg:
  # 장애 확률 판단 난수의 seed. 정하면(환경 변수 FAKE_PG_FAULT_SEED) 같은 순서의 판단이 같은 결과를 낸다.
  # 비우면 실행마다 다르다. 실행 중에는 PUT /fake/admin/faults/seed로 바꾼다.
  # fault-seed: 42
  toss:
    # 토스 시크릿 키 흉내. payment-service는 Basic 인증(base64("시크릿 키:"))으로 보낸다. 로컬 전용 값이다.
    secret-key: ${FAKE_PG_TOSS_SECRET_KEY:test_sk_fake_toss}
  kakao:
    # 카카오 시크릿 키 흉내. payment-service는 "SECRET_KEY {키}"로 보낸다. 로컬 전용 값이다.
    secret-key: ${FAKE_PG_KAKAO_SECRET_KEY:DEV_fake_kakao}
    # 카카오 테스트 가맹점 코드. 다른 cid는 400이다.
    cid: TC0ONETIME
    # 준비 응답의 결제창 URL 앞부분. 실제로 열 수 있는 페이지는 아니다(사용자 승인은 POST /fake/kakao/approve)
    checkout-url-base: ${FAKE_PG_BASE_URL:http://localhost:8090}
  # PG 지급대행(판매자 정산 지급) 흉내. 접수 뒤 이 시간이 지나야 조회 시 완료·실패로 확정된다(실제 지급대행은 영업일 시간대에 처리)
  payout:
    processing-delay-ms: ${FAKE_PG_PAYOUT_DELAY_MS:3000}
  # 결제 인증(카카오는 준비) 후 승인까지 허용하는 시간(토스는 약 10분)
  auth-valid-minutes: 10

  # 실제 PG 계약이 아닌 정산 대사 시험용 가정이다. 과거 버전 설정은 덮어쓰지 않는다.
  settlement:
    version: "fake-2026-v1"
    start-date: "2026-01-01"
    covered-until: "2027-12-31"
    providers:
      TOSS:
        rate-bp: 320
        vat-rate-bp: 1000
        business-days: 2
      KAKAO:
        rate-bp: 300
        vat-rate-bp: 1000
        business-days: 3
    holidays:
      - "2026-01-01"
      - "2026-02-16"
      - "2026-02-17"
      - "2026-02-18"
      - "2026-03-02"
      - "2026-05-01"
      - "2026-05-05"
      - "2026-05-25"
      - "2026-06-03"
      - "2026-08-17"
      - "2026-09-24"
      - "2026-09-25"
      - "2026-09-26"
      - "2026-10-05"
      - "2026-10-09"
      - "2026-12-25"
      - "2027-01-01"
      - "2027-02-05"
      - "2027-02-08"
      - "2027-03-01"
      - "2027-05-05"
      - "2027-05-13"
