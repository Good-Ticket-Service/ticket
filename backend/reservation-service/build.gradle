plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation project(':common')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // 좌석 선점(임시 점유)·쿠폰 발급 판단. 연결 정보는 config-repo/application.yml의 spring.data.redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 회차 취소 이벤트 수신. 연결 정보는 config-repo/application.yml의 spring.kafka
    implementation 'org.springframework.kafka:spring-kafka'
    // 결제 호출 보호(Bulkhead, Circuit Breaker). 사용자 요청의 결제 준비·승인만 감싼다. 버전은 Spring Cloud BOM이 정한다
    implementation 'io.github.resilience4j:resilience4j-bulkhead'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker'
    implementation 'io.github.resilience4j:resilience4j-micrometer'
    // 등급별 잔여석 조회 결과를 서버 메모리에 짧게 캐시한다(#241). gateway의 사용자 조회 캐시와 같은 라이브러리다. 버전은 Spring Boot가 정한다
    implementation 'com.github.ben-manes.caffeine:caffeine'

    runtimeOnly 'org.postgresql:postgresql'
    // 제약 위반의 제약 이름을 드라이버가 받은 서버 오류 정보에서 읽는다(좌석 선점의 부분 UNIQUE 판별). Hibernate는 이름을 영문
    // 오류 메시지 문장에서 잘라 내므로 DB 메시지 언어가 영어가 아니면 null이 된다
    compileOnly 'org.postgresql:postgresql'

    testImplementation(testFixtures(project(':common')))
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.awaitility:awaitility'
}
