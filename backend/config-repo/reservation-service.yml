server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ticket?currentSchema=reservation_schema
    username: reservation_app
    password: ${RESERVATION_DB_PASSWORD:reservation_local_pw}
  jpa:
    properties:
      hibernate:
        default_schema: reservation_schema
  cloud:
    openfeign:
      client:
        config:
          # 판매 검증은 선점 요청 안에서 동기로 부른다. 공연 서비스가 느리면 기본값(connect 5초, read 20초)보다 빨리 503으로 끝낸다.
          # 키는 SaleValidationClient의 contextId다. 측정하면서 조정할 값이다
          saleValidationClient:
            connect-timeout: 1000
            read-timeout: 3000
          # Outbox에 남은 승인 요청을 대신 보내는 작업자의 payment 호출(#422, 키는 SubstituteConfirmClient의 contextId).
          # 합이 작업자의 다시 볼 간격(payment-confirm.fallback.drain.resend-after 2초)보다 짧아야 한다. 길면 답을 기다리는 동안
          # 다른 작업자가 같은 요청을 다시 집는다. payment는 PG를 기다리지 않고 바로 답하므로 이 안에 끝난다
          substituteConfirmClient:
            connect-timeout: 1000
            read-timeout: 1500
  # 쿠폰 발급 판단(Redis Lua) 명령 제한 시간(#340). 연결 정보는 application.yml의 spring.data.redis를 그대로 쓴다.
  # 없으면 Lettuce 기본 60초를 기다리며 요청 스레드(쿠폰·예매·좌석 공용)를 잡아, Redis 장애가 서비스 전체로 번진다.
  # 평소 판단은 몇 ms라 1초면 넉넉하고, 장애면 1초 만에 503이다. 대략 "초당 쿠폰 요청 × 제한 시간"이 Tomcat 스레드(200)를 넘지 않아야 한다
  data:
    redis:
      timeout: 1s

reservation:
  # 등급별 잔여석 조회(#241). 화면 안내용이라 서버 메모리에 짧게 캐시한다. 캐시가 있으면 회차당 DB 집계는 TTL마다 한 번이라
  # 늘려도 아끼는 양은 작고, 길수록 매진 직후 좌석이 남아 보이는 시간이 길어진다. 부하 측정 때 1·3·5초를 비교해 정한다
  seat:
    remaining:
      cache-ttl: 3s
    # 좌석 배치도(선택 가능 좌석) 조회(#270). 회차별 판정 결과를 서버 메모리에 짧게 캐시해 같은 회차 요청이 DB 연결을 나눠 쓰지 않게 한다.
    # 배치도는 표시용이고 선점 API가 잠근 뒤 다시 판정하므로, 길수록 409 SEAT_ALREADY_TAKEN만 늘고 이중 선점은 생기지 않는다
    # 만든 지 cache-refresh가 지난 스냅샷은 기존 값을 주면서 전용 스레드가 뒤에서 다시 만들고, cache-max-age가 지나면 만료한다(#311).
    # cache-max-age는 cache-refresh보다 길어야 한다(아니면 기동 실패)
    selectable:
      cache-refresh: 1s
      cache-max-age: 5s

  # booking의 만료·결과 확인·취소 확인 스케줄러. 측정하면서 바꿀 값이라 코드에 기본값을 두지 않는다(docs/architecture.md의 복구 설계)
  booking:
    scheduler:
      hold-expiry:
        interval: 10s
        batch-size: 100
        # 한 번 실행이 이 시간을 넘기면 남은 건은 다음 실행에 넘긴다
        time-budget: 5s
      payment-reconcile:
        interval: 30s
        # 처리 중인 승인을 또 보내지 않도록 승인 호출의 최대 대기(connect + read)보다 길게 둔다
        threshold: 1m
        # 결제 중으로 이보다 오래 머물면 알림을 남긴다. 선점 시간보다 충분히 길어야 정상 결제가 걸리지 않는다
        stuck-after: 30m
        batch-size: 20
        time-budget: 20s
      cancel-reconcile:
        interval: 30s
        # 사용자 요청의 환불 호출이 아직 기다리는 예약을 다시 요청하지 않도록 환불 호출의 최대 대기(connect + read)보다 길게 둔다
        threshold: 1m
        batch-size: 20
        time-budget: 20s
      schedule-cancel:
        interval: 10s
        batch-size: 100
        # 취소 기록을 보기 전에 시작한 결제 시작 트랜잭션이 끝날 만큼 기다린 뒤 기록을 완료한다
        complete-after: 1m
        time-budget: 20s
      # 업무 트랜잭션이 남긴 메시지를 보낸다. 승인 요청은 커밋 직후 발행기를 깨워 바로 보내고(publish-on-commit, 키가 없으면 켜짐),
      # 이 주기는 깨우기가 놓친 행(커밋 직후 꺼짐, 보내기 실패, 다른 인스턴스가 남긴 행)을 줍는 데만 쓴다.
      # publish-on-commit을 false로 끄면 승인 요청이 이 주기만큼 늦게 payment에 닿으므로 interval도 200ms로 줄인다
      outbox:
        interval: 1s
        batch-size: 100
        send-timeout: 5s
      # 결제 중 예약 수를 세어 폴링 간격(Retry-After)의 기준 게이지를 갱신한다. 결과 확인 주기(30초)로는 결제 중이 분당 수천 건 늘 때
      # 간격이 늦게 늘어 폴링이 세 배로 치솟았다. COUNT는 부분 인덱스를 읽어 2만 건에 수 ms다
      payment-backlog:
        interval: 1s

    # 결제를 끝내는 쪽(결제 결과 소비자, Outbox 발행기, 결제 중 집계)의 전용 DB 연결 풀. 사용자 요청 풀(기본 10)과 따로 둔다.
    # 같은 풀을 쓰면 요청이 몰릴 때 결과 반영이 새 요청 스레드와 같은 줄에서 연결을 기다려 확정이 멈춘다(측정: 반영 초당 5~9건, 부하 끊기면 740건).
    # 두 풀의 합이 DB 연결 한도 안이어야 한다. 결과 소비자 동시 수 + 발행기 + 집계가 나눠 쓴다
    completion-pool:
      maximum-pool-size: 5

    # 결제 결과 소비자의 동시 스레드 수. 하나면 DB가 포화할 때 결과 반영이 밀려 200건/초부터 결제 중 예약이 쌓였고,
    # 셋이면 300건/초에서도 완료가 투입을 따라갔다(측정). 파티션 수(12)를 넘지 않는다
    payment-result:
      concurrency: 3

    # 결제 승인 방식(#321). 켜면 승인 API가 payment를 기다리지 않고 승인 요청을 메시지로 남긴 뒤 결제 중으로 바로 답한다.
    # payment의 승인 요청 소비자가 없으면 메시지 승인은 시한이 지나 모두 실패로 끝나므로, 소비자가 생길 때까지 끈다. 바꾸면 다시 띄운다.
    # 켜는 것은 예매 인스턴스가 모두 이 버전이 된 뒤에 한다. 이전 버전의 결과 확인은 시한을 보지 않고 메시지 승인을 동기로 다시 보낸다
    payment-confirm:
      via-message: ${PAYMENT_CONFIRM_VIA_MESSAGE:false}
      # 승인 요청을 받은 시각 + 5분이 시한이다. payment는 시한이 지난 요청에 PG를 부르지 않는다. 토스 승인 시한(인증 뒤 10분)의 절반.
      # 선점이 유효할 때만 받으므로 시한은 선점 만료 + 5분 안이고, payment는 READY 결제 정리를 이 값에 맞춰 미룬다(#318).
      # 바꾸려면 #318 계약을 먼저 고친다
      window: 5m
      # 결과 확인은 시한 뒤 1분을 더 기다려 묻는다. 시한은 예매 시계로 정하고 payment 시계로 비교하므로 두 시계 차이보다 크게 둔다
      grace: 1m
      # 메시지 승인 중 승인 요청이 Kafka로 나가지 못하면 새 승인을 동기로 부른다. 메시지로 받으면 브로커가 돌아올 때까지 결제 중에 묶여
      # 시한과 여유 시간(약 6분)을 기다리기 때문이다. 결제 중 집계(scheduler.payment-backlog)가 1초마다 Outbox 맨 앞 메시지를 읽고,
      # 그 메시지가 unsent-after 이상 기다렸으면 동기로 돌린다. 돌리는 동안은 Outbox에 새 행이 없으므로, 남은 행이 나가면 다시 메시지로 요청한다.
      # 돌리는 동안 결제 준비는 접수 제한 대신 결제 호출 보호(payment-guard)가 막는다
      fallback:
        # 끄면 Kafka가 멈춰도 메시지로 요청한다. 같은 이미지로 켜고 끈 Kafka 정지 측정을 비교하거나, 동기로 잘못 돌릴 때 끈다
        enabled: ${PAYMENT_CONFIRM_FALLBACK_ENABLED:true}
        # 보내기 한 번의 대기(scheduler.outbox.send-timeout)가 5초라, 이보다 오래 기다린 맨 앞 메시지는 보내기에 한 번은 실패했거나
        # 실패한 메시지 뒤에 걸려 있다. 늦게 돌리면 그 1초마다 받은 승인이 약 6분 묶이고, 잘못 돌리면 맨 앞이 나갈 때까지 새 승인이
        # 동기로 갈 뿐이라 일찍 돌리는 쪽으로 둔다. window보다 짧아야 하고 1초보다 짧을 수 없다(아니면 기동 실패)
        unsent-after: 5s
        # 동기로 돌리는 동안, 그 전에 Outbox에 남은 승인 요청을 payment에 HTTP로 대신 보내(#403) 시한 전에 끝낸다. 끄면 그 요청은
        # 브로커가 돌아오거나 결과 확인이 시한 뒤 끝낼 때까지(약 6분) 결제 중에 묶인다. 이 작업자는 #422 계약(confirmBefore 시한 검사,
        # 503 + Retry-After, READY 응답)대로 답을 읽으므로, payment가 그 대체 승인을 받기 전에는 false로 둔다.
        # 보낸 요청의 Outbox 행은 지우지 않는다. 지우면 Outbox가 비어 브로커가 멈춘 채인데 새 승인을 다시 메시지로 남기고, 그 요청이
        # 몇 초 뒤 또 묶이기를 되풀이한다. 행은 발행기가 브로커에 넘기며 지우고, payment는 이미 처리한 주문의 메시지를 받아 넘긴다
        drain:
          enabled: ${PAYMENT_CONFIRM_DRAIN_ENABLED:false}
          # 인스턴스당 동시에 보내는 요청 수. 고르기와 결과 반영이 완료 전용 풀(completion-pool 5개)을 쓰는데 발행기와 결제 중 집계가
          # 하나씩 쓰므로 4를 넘지 않는다(아니면 기동 실패). HTTP를 기다리는 동안에는 연결을 쥐지 않는다
          concurrency: 3
          # 보낸 요청을 다시 볼 수 있게 되기까지의 시간. payment가 받았다고만 답했거나 답이 없던 요청은 승인을 다시 보내지 않고
          # 이 간격으로 결제 조회를 불러 결과를 묻는다. 호출 한 번의 대기(substituteConfirmClient 타임아웃)는 이보다 짧아야 한다.
          # 1초보다 짧을 수 없다(아니면 기동 실패)
          resend-after: 2s
          # payment가 받을 자리가 없다며 돌려보낼 때 쉬는 시간의 상한. resend-after보다 짧을 수 없다(아니면 기동 실패)
          max-backoff: 30s

    # 결제 중 예약의 결과 폴링 간격(Retry-After, 초). 메시지 승인은 모든 사용자가 결과를 폴링하므로 서버가 간격을 정한다.
    # 결제 중 예약 수(결과 확인 스케줄러가 갱신하는 게이지)가 busy-above의 배수를 넘을 때마다 두 배로 늘리고 max에서 멈춘다.
    # 1,000건 기준은 추정이며 메시지 승인 측정에서 조회 부하를 보고 정한다
    payment-polling:
      base: 1s
      max: 5s
      busy-above: 1000

    # 결제 준비 접수 제한(#356). 메시지 승인에서만 동작한다. 접수 후 late-after가 지나도 결과가 없는 결제가 shed-above보다 많고
    # trend-window의 앞뒤 절반에서 모두 늘면 결제 준비를 503 + Retry-After로 거절하고, resume-below 이하로 내려오면 다시 받는다.
    # 늦은 결제는 결제 중 집계(scheduler.payment-backlog)가 세므로 stale-after는 그 주기보다 길게 둔다.
    # 거절 중에도 선점 만료가 priority-window 안이면 인스턴스마다 초당 priority-rate건까지 통과시킨다.
    # 늦은 결제에서 시한이 지난 결제와 환불 대상은 뺀다. 결과 확인이 끝낼 몫이라 남아도 거절이 풀린다.
    # 거절 응답의 Retry-After는 기다리는 사용자 수 ÷ 초당 받을 수 있는 수로 정하고 retry-after와 max-retry-after 사이로 묶는다
    admission:
      enabled: true
      late-after: 5s
      shed-above: 50
      resume-below: 10
      trend-window: 10s
      retry-after: 5s
      max-retry-after: 30s
      stale-after: 10s
      priority-window: 2m
      priority-rate: 10

    # 사용자 요청의 결제 준비·승인 보호. payment가 느리거나 멈추면 승인 대기가 Tomcat 스레드를 모두 잡아 결제와 무관한 조회까지 늦어진다.
    # 동시에 기다리는 결제 호출 수를 묶고(Bulkhead), 응답 없음이 이어지면 아예 부르지 않는다(Circuit Breaker). 막으면 바로 503이다.
    # 스케줄러 호출은 막지 않는다
    payment-guard:
      # 대기열처럼 끄고 켜며 같은 조건으로 측정을 비교한다. 운영에서 잘못 막으면 끄는 스위치이기도 하다. 바꾸면 다시 띄운다
      enabled: ${PAYMENT_GUARD_ENABLED:true}
      # Tomcat 최대 스레드(기본 200)의 40%만 결제 대기에 쓴다. 측정 환경(스레드 50)에서는 20으로 같은 비율을 쟀다
      max-concurrent-calls: ${PAYMENT_GUARD_MAX_CONCURRENT_CALLS:80}
      # 최근 호출 50번 중 20번 이상 쌓였을 때부터 판단한다
      window-size: 50
      minimum-calls: 20
      # 응답 없음(타임아웃·연결 실패·5xx)이 절반 이상이면 연다. 느린 호출은 세지 않는다(느릴 때는 Bulkhead가 맡는다)
      failure-rate-percent: 50
      # 연 뒤 10초 동안 막고, 그 뒤 5번만 보내 보고 닫을지 정한다
      open-duration: 10s
      half-open-calls: 5
      # 시험 호출 결과가 1분 안에 다 오지 않으면 다시 연다. 결제 호출 최대 대기(connect 5초 + read 20초)보다 길다
      half-open-max-wait: 1m

  # 기간 지난 회원 쿠폰의 저장 상태를 EXPIRED로 맞추는 만료 배치(#183). 설정이 없으면 꺼진다.
  # 사용 판단은 만료 시각으로 하므로 주기가 길어도 쿠폰 사용에는 영향이 없다. 운영 조회를 저장값으로 하게 되면 주기를 줄인다
  coupon:
    scheduler:
      enabled: true
      expiry:
        interval: 1h
        # 한 트랜잭션에서 바꾸는 최대 건수. 행을 오래 잠그지 않도록 나눈다
        batch-size: 500
        # 한 번 실행이 이 시간을 넘기면 남은 건은 다음 실행에 넘긴다
        time-budget: 30s
      # 쿠폰 발급 판단 맞추는 작업(#323). Redis 사본(받은 회원, 총 수량, 삭제 표시, 유효 시간)과 issued_quantity를 DB에 맞춘다.
      # 실패 즉시 되돌리기를 못 한 어긋남이 남는 최대 시간이다. Redis에만 남은 회원은 처음 본 뒤 1분이 지나야 지운다
      reconcile:
        interval: 1m
