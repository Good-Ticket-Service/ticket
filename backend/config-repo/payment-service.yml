server:
  port: 8084
  tomcat:
    threads:
      # PG 승인 300ms 기준 결제 1건이 요청 스레드를 약0.33초 잡는다. 800/s에서 300이 처리량 최대(694/s)였고
      # 250은 스레드 부족, 350은 앱 CPU 경쟁으로 줄었다(docs-local/payment-500tps-investigation 4.43~4.44).
      # PG가 느려지면 같은 유입에 더 많은 스레드가 필요하다. 유입 상한은 대기열 입장 속도로 둔다(D9).
      max: ${PAYMENT_TOMCAT_MAX_THREADS:300}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ticket?currentSchema=payment_schema
    username: payment_app
    password: ${PAYMENT_DB_PASSWORD:payment_local_pw}
    hikari:
      # 400/s에서 기본10은 사용률 약80%로 획득 대기가 Tomcat 스레드를 막았다. 20에서 COMMIT·WAL·DB CPU 증가 없이 완주했다
      # (docs-local/payment-400tps-investigation 4.10~4.11). 같은 데이터에서 800/s 기준 30이 20보다 처리량 +13%였다
      # (payment-500tps-investigation 4.44). 다른 서비스 풀(기본10)·FakePG와 합쳐 인스턴스 수 × 30이 DB max_connections(기본100)
      # 예산 안인지 함께 확인한다.
      maximum-pool-size: ${PAYMENT_DB_POOL_SIZE:30}
  jpa:
    properties:
      hibernate:
        default_schema: payment_schema

# PG 연결. 기본값(로컬 fake PG, fake 키)은 PgProperties에 있고, 여기서는 환경마다 바뀌는 값만 덮어쓴다.
# Compose는 PG_BASE_URL=http://fake-pg:8090을 넣는다. 실제 샌드박스 키는 커밋하지 않고 환경 변수로만 넣는다.
pg:
  connect-timeout: 2s
  read-timeout: 10s
  toss:
    base-url: ${PG_BASE_URL:http://localhost:8090}
    secret-key: ${PG_TOSS_SECRET_KEY:test_sk_fake_toss}
  kakao:
    base-url: ${PG_BASE_URL:http://localhost:8090}
    secret-key: ${PG_KAKAO_SECRET_KEY:DEV_fake_kakao}
    cid: ${PG_KAKAO_CID:TC0ONETIME}
  # PG별 동시 호출 상한. 승인·준비·조회·취소를 요청·복구·환불 구분 없이 같은 예산으로 센다. 자리를 못 얻으면 보내지 않고 실패(PG_BUSY).
  # 서킷이 열리기 전 감지 구간에 한 PG가 요청 스레드를 다 쓰지 못하게 한다. 200은 Tomcat 300 중 한 PG 몫이다. PG 300ms·500/s 정상에서
  # 동시 최대 약145(5초 표본)라 거절 0이었고, 150은 순간 몰림에 거절이 났다. 느린 PG를 거절 없이 받는 범위는 PG별 유입 × 지연 < 상한이다.
  # #396: 메시지 승인 PG별 자리 150(application.yml)이 같은 예산을 쓰므로 250으로 둔다. 메시지 150 + HTTP 승인·복구·환불 100.
  # HTTP 요청은 Tomcat 300이 먼저 막으므로 HTTP 몫이 100을 넘는 일은 메시지 자리가 비어 있을 때뿐이다.
  bulkhead:
    enabled: ${PAYMENT_PG_BULKHEAD_ENABLED:true}
    toss-max-concurrent: ${PAYMENT_PG_BULKHEAD_TOSS:250}
    kakao-max-concurrent: ${PAYMENT_PG_BULKHEAD_KAKAO:250}
    max-wait: ${PAYMENT_PG_BULKHEAD_MAX_WAIT:50ms}
  # PG별 서킷 브레이커. 응답 없음(타임아웃·연결 실패·5xx)이나 5초 넘는 느린 호출이 비율을 넘으면 그 PG로 보내지 않고 즉시 실패(PG_UNAVAILABLE).
  # 2~3초 지연처럼 느리지만 응답하는 PG는 막지 않는다. 업무 거절(4xx)과 429는 세지 않는다.
  circuit-breaker:
    enabled: ${PAYMENT_PG_CIRCUIT_BREAKER_ENABLED:true}
    failure-rate-percent: 50
    slow-call-duration: 5s
    slow-call-rate-percent: 80
    window-size: 50
    minimum-calls: 20
    # 연 뒤 10초 막고, 5건만 보내 보고 닫을지 정한다. 시험 결과는 PG 호출 최대 대기(연결 2초+읽기 10초)보다 긴 30초까지 기다린다
    open-duration: 10s
    half-open-calls: 5
    half-open-max-wait: 30s


# DB 집계는 별도 관측 스레드에서 수행한다. scrape는 메모리 스냅샷만 읽는다.
payment:
  observation:
    enabled: true
    interval-ms: 15000

management:
  metrics:
    distribution:
      slo:
        http.server.requests: 100ms,500ms,1s,2s,5s,10s,30s
        payment.pg.http.duration: 50ms,200ms,1s,3s,10s,15s
        payment.refund.accept.duration: 10ms,50ms,100ms,500ms,1s
        payment.refund.request.duration: 100ms,500ms,1s,5s,15s,30s
        payment.refund.completion.duration: 1s,10s,60s,300s,900s,3600s,86400s
        payment.refund.record.completion.duration: 1s,10s,60s,300s,900s,3600s,86400s
        payment.approval.completion.duration: 100ms,1s,5s,10s,60s,300s
        payment.compensation.discovery.duration: 1s,10s,60s,300s,900s,3600s,86400s
        payment.execution.claim.delay: 100ms,1s,10s,60s,300s,900s,3600s
