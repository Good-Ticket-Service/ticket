# performance-service의 local 프로필 전용 설정. application-local.yml(ddl-auto: create)과 함께 내려간다.

spring:
  jpa:
    # 시드 SQL을 Hibernate가 테이블을 만든 뒤에 실행한다. 기본값(false)이면 테이블이 없어 실패한다.
    defer-datasource-initialization: true
  sql:
    init:
      # 등록 API가 생기기 전까지 공개 조회를 확인할 데이터. local은 기동마다 테이블을 다시 만드므로 매번 새로 넣는다.
      mode: always
      data-locations: classpath:db/seed-local.sql
      # 지정하지 않으면 OS 기본 인코딩으로 읽는다. Windows 한글 환경(MS949)에서 한글 값이 깨진다.
      encoding: UTF-8
