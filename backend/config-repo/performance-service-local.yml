# performance-service의 local 프로필 전용 설정. application-local.yml(ddl-auto: create)과 함께 내려간다.

spring:
  jpa:
    # 시드 SQL을 Hibernate가 테이블을 만든 뒤에 실행한다. 기본값(false)이면 테이블이 없어 실패한다.
    defer-datasource-initialization: true
  sql:
    init:
      # 등록 API가 생기기 전까지 공개 조회를 확인할 데이터. local은 기동마다 테이블을 다시 만드므로 매번 새로 넣는다.
      mode: always
      # 부하 측정용 공연·회차(seed-load.sql, #173)는 기존 시드 다음에 넣는다. 좌석 서비스의 부하용 회차 좌석과 짝이다.
      data-locations: classpath:db/seed-local.sql,classpath:db/seed-load.sql
      # 지정하지 않으면 OS 기본 인코딩으로 읽는다. Windows 한글 환경(MS949)에서 한글 값이 깨진다.
      encoding: UTF-8

performance:
  seat-setup:
    # 좌석 쪽 seat-setups 엔드포인트가 구현되기 전까지 임시 구현체를 쓴다(2026-10-30 결정). 구현되면 이 줄을 지운다
    client: stub
