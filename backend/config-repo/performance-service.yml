server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ticket?currentSchema=performance_schema
    username: performance_app
    password: ${PERFORMANCE_DB_PASSWORD:performance_local_pw}
  jpa:
    properties:
      hibernate:
        default_schema: performance_schema
  # 공개 공연 상세·회차 목록 캐시(이슈 #398, 이슈 #431). 공통 Redis 연결 정보를 쓴다.
  # 캐시가 실패하면 DB로 응답하므로 기다리지 않는 편이 낫다. 없으면 Lettuce 기본 60초를 기다리며 요청 스레드를 잡는다.
  # 평소 명령은 1ms 안팎이라 100ms면 넉넉하다. 장애가 이어지면 캐시별 회로 차단기가 Redis를 잠시 건너뛴다
  data:
    redis:
      timeout: 100ms
      connect-timeout: 200ms
  cloud:
    openfeign:
      client:
        config:
          # 회차 좌석 준비(공연 → 좌석, 이슈 #175 합의). 키는 SeatSetupFeignClient의 contextId다.
          # read 5초는 잠정값이다. 좌석 담당이 좌석 준비 API를 구현할 때 회차당 1,000석 기준으로 재서 조정한다
          seatSetupClient:
            connect-timeout: 1000
            read-timeout: 5000

management:
  health:
    redis:
      # Redis는 조회 캐시라서 장애여도 DB로 응답한다. 헬스 체크에 넣으면 Redis 장애가 공연 서비스 DOWN(재시작·트래픽 제외)이 된다
      enabled: false

performance:
  schedule-list-cache:
    # 저장한 조회값으로 판매 상태는 요청마다 계산한다(이슈 #431). 적중 시 TTL을 늘리지 않는다.
    ttl: 1m
    jitter: 6s
    failure-threshold: 5
    open-duration: 10s
  detail-cache:
    # TTL은 저장 시점부터다. 적중해도 늘리지 않는다. jitter는 0–60초를 더해 여러 키의 만료를 흩는다(이슈 #398)
    ttl: 10m
    jitter: 60s
    # 명령이 5번 연속 실패하면 10초 동안 Redis를 건너뛰고 DB로 간다. 지나면 다시 시도한다
    failure-threshold: 5
    open-duration: 10s
  seat-setup:
    # feign(기본) 또는 stub. stub은 좌석 서비스를 부르지 않고 성공으로 처리하는 임시 구현체다
    client: feign
    retry:
      # 일시 실패(409 SEAT_SETUP_IN_USE 포함) 재시도: 최대 8회, 간격 10초에서 두 배씩(상한 5분), 첫 시도부터 약 15분.
      # 15분은 선점(10분)이 만료·정리되기를 기다리는 길이다. 첫 간격은 connect + read 타임아웃(6초)보다 길어야 한다
      max-attempts: 8
      first-delay: 10s
      max-delay: 5m
      # 재시도 스케줄러: 5초마다 다음 시도 시각이 지난 PENDING 회차를 최대 50개 보낸다
      fixed-delay-ms: 5000
      batch-size: 50
    recovery:
      # 일반 시도를 마친 결과 불명 작업만 확인한다. 준비 상태는 성공 확인 전까지 FAILED를 유지한다.
      enabled: true
      max-attempts: 3
      first-delay: 30s
      max-delay: 120s
      # 복구 호출 중 다른 실행이 같은 작업을 잡지 못하게 하는 임대. HTTP 대기와 DB 처리 여유를 포함한다.
      # connect + read 타임아웃(현재 6초)보다 길게 두고, 타임아웃 변경 시 함께 검토한다.
      lease: 15s
      fixed-delay-ms: 5000
      batch-size: 20
