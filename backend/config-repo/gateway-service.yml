server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            # Note: 내부 호출이 이어지는 요청이 Gateway에서 먼저 끊기지 않게 하위 서비스 read 타임아웃(20초)보다 길게 둔다.
            response-timeout: 60s
          # Note: lb:// 는 Eureka에 등록된 서비스 이름으로 인스턴스를 찾아 라운드로빈으로 분산한다. 인스턴스를 늘려도 Gateway 설정은 바뀌지 않는다.
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**, /api/users/**
            - id: performance-service
              uri: lb://performance-service
              predicates:
                # Note: 회차 단건은 한 단계 경로만 받는다. /api/schedules/{id}/queue(대기열)는 reservation-service 경로라 ** 로 넓히지 않는다.
                # 판매자·관리자는 리소스별로 나열한다. /api/seller/**·/api/admin/** 로 넓히면 아래 payment-service의
                # /api/seller/settlements/**·/api/admin/payments/** 까지 여기서 먼저 잡힌다(이슈 #134). 아직 없는 venues 조회·관리자 공연 조회도 명세 경로라 넣어 둔다.
                # 이 경로들은 인증 예외가 아니다. Gateway는 로그인만 확인하고 역할은 공연 서비스가 확인한다(Gateway 역할 검사는 이슈 #236에서 결정).
                - Path=/api/performances/**, /api/schedules/{scheduleId}, /api/seller/performances/**, /api/seller/schedules/**, /api/seller/venues/**, /api/admin/venues/**, /api/admin/schedules/**, /api/admin/performances/**
            - id: reservation-service
              uri: lb://reservation-service
              predicates:
                - Path=/api/reservations/**, /api/coupons/**, /api/seats/**, /api/queues/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**,/api/admin/payments/**,/api/seller/settlements/**,/api/seller/payout-account,/api/admin/settlements/**
            # 서비스별 OpenAPI 문서. Gateway Swagger UI가 /{서비스}/v3/api-docs 로 불러온다.
            - id: user-service-docs
              uri: lb://user-service
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - RewritePath=/user-service/v3/api-docs, /v3/api-docs
            - id: performance-service-docs
              uri: lb://performance-service
              predicates:
                - Path=/performance-service/v3/api-docs
              filters:
                - RewritePath=/performance-service/v3/api-docs, /v3/api-docs
            - id: reservation-service-docs
              uri: lb://reservation-service
              predicates:
                - Path=/reservation-service/v3/api-docs
              filters:
                - RewritePath=/reservation-service/v3/api-docs, /v3/api-docs
            - id: payment-service-docs
              uri: lb://payment-service
              predicates:
                - Path=/payment-service/v3/api-docs
              filters:
                - RewritePath=/payment-service/v3/api-docs, /v3/api-docs

jwt:
  secret: ${JWT_SECRET}

# 대기열 입장 토큰 검사(좌석 조회·선점). 켜고 끄는 설정은 없다. reservation-service 대기열이 보호하는 회차(room의 scope)만
# 검사하고, 그 목록은 10초마다 받는다(queue.protected-scopes-interval, 기본 10s).
# 서명 키는 reservation-service가 발급에 쓰는 QUEUE_TOKEN_SECRET과 같은 값이고 저장소에 두지 않는다
queue:
  token-secret: ${QUEUE_TOKEN_SECRET}

auth:
  # 인증 없이 통과시키는 경로
  whitelist:
    - /api/auth/signup
    - /api/auth/seller/signup
    - /api/auth/login
    # 공개 공연 조회(목록·상세·회차·좌석 배치). 모두 GET이고, 공연 쓰기 API는 /api/seller/**·/api/admin/** 에 있다
    - /api/performances/**
    # 공개 회차 상세(GET만 있음). * 는 한 단계만 맞으므로 인증이 필요한 /api/schedules/{id}/queue 는 여기에 걸리지 않는다
    - /api/schedules/*
    # 공개 잔여석 조회(GET만 있음). 좌석 조회·선점은 인증이 필요하므로 /api/seats/** 전체를 넣지 않는다
    - /api/seats/schedules/*/remaining
    - /swagger-ui.html
    - /swagger-ui/**
    - /webjars/**
    - /v3/api-docs/**
    - /*/v3/api-docs/**
    # 기동 확인용. 상세 정보 없이 상태(UP/DOWN)만 응답한다
    - /actuator/health
    # Prometheus 수집용. Note: Gateway 8080은 외부에 공개되므로 배포할 때는 이 경로를 외부에서 막거나
    # management.server.port로 관리 포트를 분리해야 한다. 지금은 로컬 개발 환경만 가정한다.
    - /actuator/prometheus
  # 권한 재확인 결과 캐시 시간. 권한 변경·탈퇴는 최대 이 시간만큼 늦게 반영된다
  user-cache-ttl: 60s

springdoc:
  swagger-ui:
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
      - name: performance-service
        url: /performance-service/v3/api-docs
      - name: reservation-service
        url: /reservation-service/v3/api-docs
      - name: payment-service
        url: /payment-service/v3/api-docs
