spring:
  datasource:
    hikari:
      # Note: URL을 환경 변수나 Testcontainers로 교체해도 드라이버 배치 재작성을 유지한다.
      data-source-properties:
        reWriteBatchedInserts: true
        # 공연 서비스 연결에만 플래너의 무작위 읽기 비용을 낮춘다(기본 4). DB 서버·다른 서비스 설정은 그대로다(이슈 #471).
        # Note: 기본값에서는 시작 전 회차로 공연 수백 개만 고르는 목록 개수·예매 오픈 순 쿼리도 공연 전체를 순차 스캔했다.
        #       데이터가 대부분 메모리(공유 버퍼)에 있어 PK 접근이 싸다. 3년 누적 DB 진단에서 기본 개수 36.7 → 2.7ms.
        #       config-repo에서 data-source-properties를 다시 정의하면 이 값이 빠질 수 있다.
        options: "-c random_page_cost=1.1"
  jpa:
    properties:
      hibernate:
        # Note: 서비스 전체 설정이다. 지금 INSERT가 묶이는 엔티티는 SEQUENCE를 쓰는 VenueSeat뿐이다(나머지는 IDENTITY).
        #       다른 엔티티를 SEQUENCE로 바꾸면 그 INSERT도 함께 묶인다.
        jdbc.batch_size: 50
        id.optimizer.pooled.preferred: pooled
  application:
    name: performance-service
  profiles:
    # 프로필을 지정하지 않으면 local로 뜬다. 다른 환경은 SPRING_PROFILES_ACTIVE(예: dev)로 바꾼다.
    default: local
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      # config-server에 접속하지 못하면 기본값(포트 8080 등)으로 뜨지 않고 바로 실패한다
      fail-fast: true
