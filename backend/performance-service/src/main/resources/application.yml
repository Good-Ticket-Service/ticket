spring:
  datasource:
    hikari:
      # Note: URL을 환경 변수나 Testcontainers로 교체해도 드라이버 배치 재작성을 유지한다.
      data-source-properties:
        reWriteBatchedInserts: true
  jpa:
    properties:
      hibernate:
        jdbc.batch_size: 50
        id.optimizer.pooled.preferred: pooled
  application:
    name: performance-service
  profiles:
    # 프로필을 지정하지 않으면 local로 뜬다. 다른 환경은 SPRING_PROFILES_ACTIVE(예: dev)로 바꾼다.
    default: local
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      # config-server에 접속하지 못하면 기본값(포트 8080 등)으로 뜨지 않고 바로 실패한다
      fail-fast: true
