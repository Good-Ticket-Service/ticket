spring:
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
      data-source-properties:
        # DB 제약 실패의 상세 행에 거래 키가 포함될 수 있다. 기본 오류·제약 이름은 유지한다.
        logServerErrorDetail: false
  kafka:
    admin:
      fail-fast: false
      operation-timeout: 2s
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 1000
        request.timeout.ms: 2000
        delivery.timeout.ms: 5000
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  application:
    name: payment-service
  profiles:
    # 프로필을 지정하지 않으면 local로 뜬다. 다른 환경은 SPRING_PROFILES_ACTIVE(예: dev)로 바꾼다.
    default: local
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      # config-server에 접속하지 못하면 기본값(포트 8080 등)으로 뜨지 않고 바로 실패한다
      fail-fast: true
  task:
    scheduling:
      pool:
        # @Scheduled 잡은 스케줄러 하나를 함께 쓰고 Boot 기본 스레드는 1개다. 그러면 정산 대조·정산서 발행·PG 조회가 긴 잡이
        # 도는 동안 결제 Recovery(결과 1분 확정)·환불 Recovery가 멈춘다. 잡마다 스레드를 하나씩 둔다(@Scheduled 메서드 19개).
        # 잡을 늘리면 함께 늘린다. 잡끼리는 SKIP LOCKED·임대로 다중 인스턴스 동시 실행을 이미 전제한다.
        # 동시에 도는 잡이 늘면 DB 연결도 그만큼 더 쓸 수 있다(잡당 최대 1개, 결제 풀 20).
        # 가상 스레드를 켜면 Boot가 실행마다 가상 스레드를 쓰는 스케줄러로 바꿔 이 값은 쓰이지 않는다.
        size: 19

# 판매자 정산 정책·영업일 달력(settlement-design 2절). 버전을 지우지 않고 덧붙인다. 정산 항목은 승인 시각의 버전을 고정한다.
# 요율은 팀 합의 전 시험용 제안이다(profit-policy.md). 값이 틀리면 기동하지 않는다.
payment:
  messaging:
    # 예매 전 인스턴스 전환·결과 relay 배포 확인 후 켠다. 기존 HTTP 승인은 유지한다.
    confirm:
      enabled: false
      concurrency: 3
      max-poll-records: 16
      workers: 16
      per-provider: 8
      max-in-flight: 48
      retry-delay: 200ms
      max-infrastructure-retries: 4
      max-message-bytes: 8192

  pg:
    enabled: true
    start-date: "2026-01-01"
    page-size: 2000
    grace-business-days: 1
    fees:
      - provider: TOSS
        version: "toss-2026-v1"
        effective-from: "2026-01-01T00:00:00"
        rate-bp: 320
        vat-rate-bp: 1000
        business-days: 2
      - provider: KAKAO
        version: "kakao-2026-v1"
        effective-from: "2026-01-01T00:00:00"
        rate-bp: 300
        vat-rate-bp: 1000
        business-days: 3
  settlement:
    consumer-recovery:
      # 실제 적용이 끝나야 명령을 완료한다. 미해결 이력 관측은 Kafka 중지 때도 유지한다.
      replay-enabled: true
      observation-enabled: true
    # 전체 처리자 배포·검증 후 신규 작업만 KAFKA로 전환한다. 기존 작업의 transport는 유지한다.
    posting:
      transport: KAFKA
      kafka:
        enabled: true
        relay-enabled: true
        consumer-enabled: true
        concurrency: 2
    # 예상 정산 집계는 항상 사용한다. 긴급 중지 시에도 금융 원장과 이미 보존한 사건은 유지한다.
    projection:
      enabled: true
      auto-start: true
      # D=DB 워커, B=일반 Kafka Consumer, C=Kafka Streams. 기존 세대의 엔진은 설정만으로 바꾸지 않는다.
      mode: B
      partitions: 6
      batch-size: 500
      max-publish-batches: 8
      max-publish-run-millis: 1000
      threads: 2
      fixed-delay-ms: 1000
      lease: 30s
      send-timeout: 5s
      stale-after: 10s
    # 정산 반영 워커(#304). 결제 승인 확정·환불 완료가 함께 저장한 작업(p_settlement_jobs)을 별도 트랜잭션에서 처리해
    # SALE·원장을 그 결제의 현재 상태에 맞춘다. 정산 오류가 결제 확정을 롤백하지 않게 하려는 분리다.
    # 끄면(긴급 우회) 작업은 계속 쌓이고, 다시 켜면 이어서 처리한다. 결제·환불 확정에는 영향이 없다.
    worker:
      enabled: true
      fixed-delay-ms: 1000
      # 한 번 실행에서 처리할 최대 작업 수와 새 작업을 시작하는 시간 예산
      batch-size: 100
      max-run-seconds: 15
      # 이만큼 실패하면 격리(BLOCKED)하고 경보한다. 재시도 간격은 첫 실패 30초에서 두 배씩 늘려 10분까지
      max-attempts: 5
      retry-delay: 30s
      max-retry-delay: 10m
    # 계산 실패(UNPOSTED) SALE을 10분마다 다시 계산한다. 포착 누락은 작업이 결제 확정과 함께 저장되므로 따로 찾지 않는다.
    backfill:
      enabled: true
      fixed-delay-ms: 600000
      batch-size: 100
      max-per-run: 1000
    # 매일 KST 04:00 판매자·회차별 정산서 발행. 지급 실행은 따로 켜고 끈다.
    statement:
      enabled: true
      cron: "0 0 4 * * *"
      batch-size: 100
      # 발행 한 건이 행 잠금을 기다리는 최대 시간. 넘으면 그 건만 실패하고 다음 실행이 다시 찾는다
      lock-timeout-ms: 5000
    # 판매자 지급(모의 PG 지급대행). enabled=false는 새 지급 요청·같은 키 재전송만 막는 긴급 차단이고, 이미 보낸 지급의 결과 조회(recovery)는 따로 켠다.
    payout:
      enabled: true
      recovery:
        enabled: true
    # KST 03시 내부 대조 Batch: 월~토 DAILY·일요일 FULL. 금융 원천은 읽고 파생 기준·결과만 기록한다.
    # 기동 1분 뒤 최근 도래 슬롯을 보충하고, 매분 기술 실패의 제한 재시도를 확인한다.
    reconcile:
      enabled: true
      # 검사 SQL 하나의 제한 시간. 넘으면 그 검사만 미완료로 남기고 나머지를 계속하며, 실행은 FAILED다(#310)
      statement-timeout: 60s
    policies:
      - version: "2026-10-30-v1"
        effective-from: "2026-01-01T00:00:00"
        commission-rate-bp: 1200
        vat-rate-bp: 1000
        pg-rate-bp: 340
        pg-vat-rate-bp: 1000
        pg-fee-refunded-on-cancel: true
        eligible-business-days: 3
    calendars:
      # 주말 외 휴무일. 은행 이체 기준이라 은행 휴무인 근로자의 날(5/1)을 포함한다. 2027년은 음력 날짜를 관보로 다시 확인한다.
      - version: "kr-2026-2027-v1"
        effective-from: "2026-01-01T00:00:00"
        covered-until: "2027-12-31"
        holidays:
          - "2026-01-01"
          - "2026-02-16"
          - "2026-02-17"
          - "2026-02-18"
          - "2026-03-02"
          - "2026-05-01"
          - "2026-05-05"
          - "2026-05-25"
          - "2026-06-03"
          - "2026-08-17"
          - "2026-09-24"
          - "2026-09-25"
          - "2026-09-26"
          - "2026-10-05"
          - "2026-10-09"
          - "2026-12-25"
          - "2027-01-01"
          - "2027-02-05"
          - "2027-02-08"
          - "2027-03-01"
          - "2027-05-05"
          - "2027-05-13"
          - "2027-08-16"
          - "2027-09-14"
          - "2027-09-15"
          - "2027-09-16"
          - "2027-10-04"
          - "2027-10-11"
          - "2027-12-27"

