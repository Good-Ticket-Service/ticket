spring:
  application:
    name: payment-service
  profiles:
    # 프로필을 지정하지 않으면 local로 뜬다. 다른 환경은 SPRING_PROFILES_ACTIVE(예: dev)로 바꾼다.
    default: local
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      # config-server에 접속하지 못하면 기본값(포트 8080 등)으로 뜨지 않고 바로 실패한다
      fail-fast: true

# 판매자 정산 정책·영업일 달력(settlement-design 2절). 버전을 지우지 않고 덧붙인다. 정산 항목은 승인 시각의 버전을 고정한다.
# 요율은 팀 합의 전 시험용 제안이다(profit-policy.md). 값이 틀리면 기동하지 않는다.
payment:
  settlement:
    # 결제 승인 때 정산 항목·판매 분개 포착. 환불 반영(Task 20-4)까지 검증한 뒤 함께 켠다. 끄면 포착이 빠진 결제는 보충 잡이 메운다.
    capture-enabled: false
    # 포착이 빠진 결제와 계산 실패(UNPOSTED) SALE을 10분마다 메운다. 포착 스위치와 따로 켜고 끈다. 환불 반영은 스위치 없이 항상 동작한다.
    backfill:
      enabled: false
      fixed-delay-ms: 600000
      batch-size: 100
      max-per-run: 1000
    # 매일 KST 04:00 판매자·회차별 정산서 발행. 환불 반영·보충을 검증한 뒤 켠다. 발행해도 지급 실행은 따로 켠다.
    statement:
      enabled: false
      cron: "0 0 4 * * *"
      batch-size: 100
      # 발행 한 건이 행 잠금을 기다리는 최대 시간. 넘으면 그 건만 실패하고 다음 실행이 다시 찾는다
      lock-timeout-ms: 5000
    policies:
      - version: "2026-10-30-v1"
        effective-from: "2026-01-01T00:00:00"
        commission-rate-bp: 1200
        vat-rate-bp: 1000
        pg-rate-bp: 340
        pg-vat-rate-bp: 1000
        pg-fee-refunded-on-cancel: true
        eligible-business-days: 3
    calendars:
      # 주말 외 휴무일. 은행 이체 기준이라 은행 휴무인 근로자의 날(5/1)을 포함한다. 2027년은 음력 날짜를 관보로 다시 확인한다.
      - version: "kr-2026-2027-v1"
        effective-from: "2026-01-01T00:00:00"
        covered-until: "2027-12-31"
        holidays:
          - "2026-01-01"
          - "2026-02-16"
          - "2026-02-17"
          - "2026-02-18"
          - "2026-03-02"
          - "2026-05-01"
          - "2026-05-05"
          - "2026-05-25"
          - "2026-06-03"
          - "2026-08-17"
          - "2026-09-24"
          - "2026-09-25"
          - "2026-09-26"
          - "2026-10-05"
          - "2026-10-09"
          - "2026-12-25"
          - "2027-01-01"
          - "2027-02-05"
          - "2027-02-08"
          - "2027-03-01"
          - "2027-05-05"
          - "2027-05-13"
          - "2027-08-16"
          - "2027-09-14"
          - "2027-09-15"
          - "2027-09-16"
          - "2027-10-04"
