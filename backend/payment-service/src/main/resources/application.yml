spring:
  application:
    name: payment-service
  profiles:
    # 프로필을 지정하지 않으면 local로 뜬다. 다른 환경은 SPRING_PROFILES_ACTIVE(예: dev)로 바꾼다.
    default: local
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      # config-server에 접속하지 못하면 기본값(포트 8080 등)으로 뜨지 않고 바로 실패한다
      fail-fast: true
  task:
    scheduling:
      pool:
        # @Scheduled 잡은 스케줄러 하나를 함께 쓰고 Boot 기본 스레드는 1개다. 그러면 정산 대조·정산서 발행·PG 조회가 긴 잡이
        # 도는 동안 결제 Recovery(결과 1분 확정)·환불 Recovery가 멈춘다. 잡마다 스레드를 하나씩 둔다(@Scheduled 메서드 10개).
        # 잡을 늘리면 함께 늘린다. 잡끼리는 SKIP LOCKED·임대로 다중 인스턴스 동시 실행을 이미 전제한다.
        # 동시에 도는 잡이 늘면 DB 연결도 그만큼 더 쓸 수 있다(잡당 최대 1개, 결제 풀 20).
        # 가상 스레드를 켜면 Boot가 실행마다 가상 스레드를 쓰는 스케줄러로 바꿔 이 값은 쓰이지 않는다.
        size: 10

# 판매자 정산 정책·영업일 달력(settlement-design 2절). 버전을 지우지 않고 덧붙인다. 정산 항목은 승인 시각의 버전을 고정한다.
# 요율은 팀 합의 전 시험용 제안이다(profit-policy.md). 값이 틀리면 기동하지 않는다.
payment:
  settlement:
    # 결제 승인 때 정산 항목·판매 분개 포착. 끄면 포착이 빠진 결제는 보충 잡이 메운다(긴급 우회용).
    # Task 20-12 장애 정합성·성능 시험을 마친 뒤 정산 스위치를 모두 켰다(2026-11-01).
    capture-enabled: true
    # 포착이 빠진 결제와 계산 실패(UNPOSTED) SALE을 10분마다 메운다. 포착 스위치와 따로 켜고 끈다. 환불 반영은 스위치 없이 항상 동작한다.
    backfill:
      enabled: true
      fixed-delay-ms: 600000
      batch-size: 100
      max-per-run: 1000
    # 매일 KST 04:00 판매자·회차별 정산서 발행. 지급 실행은 따로 켜고 끈다.
    statement:
      enabled: true
      cron: "0 0 4 * * *"
      batch-size: 100
      # 발행 한 건이 행 잠금을 기다리는 최대 시간. 넘으면 그 건만 실패하고 다음 실행이 다시 찾는다
      lock-timeout-ms: 5000
    # 판매자 지급(모의 PG 지급대행). enabled=false는 새 지급 요청·같은 키 재전송만 막는 긴급 차단이고, 이미 보낸 지급의 결과 조회(recovery)는 따로 켠다.
    payout:
      enabled: true
      recovery:
        enabled: true
    # 매일 KST 03:00 정산 전체 대조(읽기 전용). 기동 1분 뒤에도 1회 돈다.
    reconcile:
      enabled: true
    policies:
      - version: "2026-10-30-v1"
        effective-from: "2026-01-01T00:00:00"
        commission-rate-bp: 1200
        vat-rate-bp: 1000
        pg-rate-bp: 340
        pg-vat-rate-bp: 1000
        pg-fee-refunded-on-cancel: true
        eligible-business-days: 3
    calendars:
      # 주말 외 휴무일. 은행 이체 기준이라 은행 휴무인 근로자의 날(5/1)을 포함한다. 2027년은 음력 날짜를 관보로 다시 확인한다.
      - version: "kr-2026-2027-v1"
        effective-from: "2026-01-01T00:00:00"
        covered-until: "2027-12-31"
        holidays:
          - "2026-01-01"
          - "2026-02-16"
          - "2026-02-17"
          - "2026-02-18"
          - "2026-03-02"
          - "2026-05-01"
          - "2026-05-05"
          - "2026-05-25"
          - "2026-06-03"
          - "2026-08-17"
          - "2026-09-24"
          - "2026-09-25"
          - "2026-09-26"
          - "2026-10-05"
          - "2026-10-09"
          - "2026-12-25"
          - "2027-01-01"
          - "2027-02-05"
          - "2027-02-08"
          - "2027-03-01"
          - "2027-05-05"
          - "2027-05-13"
          - "2027-08-16"
          - "2027-09-14"
          - "2027-09-15"
          - "2027-09-16"
          - "2027-10-04"
          - "2027-10-11"
          - "2027-12-27"

