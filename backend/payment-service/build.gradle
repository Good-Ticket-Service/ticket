plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation project(':common')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // PG별 서킷 브레이커. 예매 payment-guard와 같은 라이브러리이고 버전은 Spring Cloud BOM이 정한다
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker'
    implementation 'io.github.resilience4j:resilience4j-micrometer'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation(testFixtures(project(':common')))
}

// Note: PG 어댑터 계약 테스트는 실제 fake PG를 컨테이너로 띄워 HTTP로 부른다. Dockerfile 전체를 빌드하면 수 분이 걸리므로
// fake-pg의 실행 jar를 먼저 만들고, 테스트가 그 jar를 JRE 컨테이너에 넣어 실행한다(FakePgContainer).
def fakePgJar = project(':fake-pg').tasks.named('bootJar').flatMap { it.archiveFile }
tasks.named('test') {
    dependsOn ':fake-pg:bootJar'
    inputs.file(fakePgJar)
    doFirst {
        systemProperty 'fakePg.jar', fakePgJar.get().asFile.absolutePath
    }
}

// 정규 build와 분리한 명시적 측정. 실제 PostgreSQL·FakePG HTTP와 별도 결제 JVM을 사용한다.
tasks.register('pgSettlementPerformance', Test) {
    dependsOn testClasses, bootJar, ':fake-pg:bootJar'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching '*PgSettlementPerformanceTest' }
    maxHeapSize = '1g'
    systemProperty 'pg.settlement.measure', 'true'
    systemProperty 'pg.settlement.rows', providers.gradleProperty('pgSettlementRows').getOrElse('500000')
    doFirst {
        systemProperty 'fakePg.jar', fakePgJar.get().asFile.absolutePath
        systemProperty 'payment.jar', tasks.bootJar.archiveFile.get().asFile.absolutePath
    }
}
