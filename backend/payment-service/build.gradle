plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation project(':common')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // PG별 서킷 브레이커. 예매 payment-guard와 같은 라이브러리이고 버전은 Spring Cloud BOM이 정한다
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker'
    implementation 'io.github.resilience4j:resilience4j-micrometer'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation(testFixtures(project(':common')))
    testImplementation 'org.testcontainers:kafka'
}

// Note: PG 어댑터 계약 테스트는 실제 fake PG를 컨테이너로 띄워 HTTP로 부른다. Dockerfile 전체를 빌드하면 수 분이 걸리므로
// fake-pg의 실행 jar를 먼저 만들고, 테스트가 그 jar를 JRE 컨테이너에 넣어 실행한다(FakePgContainer).
def fakePgJar = project(':fake-pg').tasks.named('bootJar').flatMap { it.archiveFile }
tasks.named('test') {
    dependsOn ':fake-pg:bootJar'
    inputs.file(fakePgJar)
    doFirst {
        systemProperty 'fakePg.jar', fakePgJar.get().asFile.absolutePath
    }
}

// 정규 build와 분리한 명시적 측정. 실제 PostgreSQL·FakePG HTTP와 별도 결제 JVM을 사용한다.
tasks.register('pgSettlementPerformance', Test) {
    dependsOn testClasses, bootJar, ':fake-pg:bootJar'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching '*PgSettlementPerformanceTest' }
    maxHeapSize = '1g'
    systemProperty 'pg.settlement.measure', 'true'
    systemProperty 'pg.settlement.rows', providers.gradleProperty('pgSettlementRows').getOrElse('500000')
    doFirst {
        systemProperty 'fakePg.jar', fakePgJar.get().asFile.absolutePath
        systemProperty 'payment.jar', tasks.bootJar.archiveFile.get().asFile.absolutePath
    }
}

// Note: 기본 build와 분리한다. 임시 DB에서 기존 SQL·실행 계획을 반복 측정한다.
tasks.register('reconcilePerformance', Test) {
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching '*ReconcilePerformanceTest' }
    maxHeapSize = '1g'
    systemProperty 'reconcile.measure', 'true'
    systemProperty 'reconcile.rows', providers.gradleProperty('reconcileRows').getOrElse('10000')
    systemProperty 'reconcile.phase', providers.gradleProperty('reconcilePhase').getOrElse('M0')
    systemProperty 'reconcile.repeats', providers.gradleProperty('reconcileRepeats').getOrElse('3')
    systemProperty 'reconcile.output', providers.gradleProperty('reconcileOutput').getOrElse('build/reconcile-performance')
    outputs.upToDateWhen { false }
}

tasks.register('reconcileRecovery', Test) {
    dependsOn testClasses, bootJar
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching '*ReconcileProcessRecoveryTest' }
    maxHeapSize = '768m'
    systemProperty 'reconcile.recovery', 'true'
    systemProperty 'baseline.payment.jar', providers.gradleProperty('reconcileBaselineJar').getOrElse('')
    systemProperty 'reconcile.output', providers.gradleProperty('reconcileOutput').getOrElse('build/reconcile-recovery')
    doFirst { systemProperty 'payment.jar', tasks.bootJar.archiveFile.get().asFile.absolutePath }
    outputs.upToDateWhen { false }
}

// Note: 결과 전달의 짧은 실제 예매 연동만 별도로 실행한다. 기본 build에서 다른 서비스 JVM을 띄우지 않는다.
tasks.register('paymentResultIntegration', Test) {
    dependsOn testClasses, ':reservation-service:bootJar'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching '*PaymentResultReservationIntegrationTest' }
    systemProperty 'payment.result.integration', 'true'
    doFirst {
        systemProperty 'reservation.jar', project(':reservation-service').tasks.bootJar.archiveFile.get().asFile.absolutePath
    }
}
