# 실행: docker compose up -d --build   (빌드는 backend/Dockerfile 안에서 한다)
# 사전 준비: cp .env.example .env
# 관리용 포트(postgres, redis, kafka, kafka-ui, prometheus, grafana, config-server, eureka)는 이 PC(127.0.0.1)에서만 열고,
# 외부에는 Gateway 8080만 공개한다.
# 네트워크는 둘이다. ticket-net(앞단: Gateway·플랫폼·업무 서비스·모니터링), ticket-data(업무 서비스·postgres·redis·kafka).
# 업무 서비스만 두 네트워크에 함께 붙고, Gateway는 postgres·redis에 닿지 않는다.

x-app: &app
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: on-failure
  networks: [ticket-net]

# backend/config-repo의 ${...} 자리표시자를 채우는 값. 설정 자체는 config-server가 내려준다.
x-service-env: &service-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://eureka-server:8761/eureka
  # Note: 컨테이너 호스트명(컨테이너 ID) 대신 IP로 Eureka에 등록해야 Gateway가 다른 컨테이너에서 찾아갈 수 있다.
  EUREKA_PREFER_IP: "true"
  # Note: 업무 서비스는 네트워크가 둘이라 IP도 둘이다. ticket-data 쪽 IP가 Eureka에 등록되면 그 네트워크에 없는 Gateway가
  # 연결하지 못한다. 등록할 IP를 ticket-net 대역으로 고정한다(spring.cloud.inetutils.preferred-networks, 접두어 일치).
  SPRING_CLOUD_INETUTILS_PREFERREDNETWORKS: ${TICKET_NET_PREFIX:-10.220.10.}
  DB_HOST: postgres
  REDIS_HOST: redis
  # 컨테이너끼리는 Kafka의 INTERNAL 리스너(kafka:29092)로 붙는다. IDE로 띄운 앱은 기본값 localhost:9092를 쓴다.
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

x-db-service: &db-service
  <<: *app
  networks: [ticket-net, ticket-data]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
    config-server:
      condition: service_healthy
    eureka-server:
      condition: service_started

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ticket
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD가 필요하다}
      PERFORMANCE_DB_PASSWORD: ${PERFORMANCE_DB_PASSWORD:?PERFORMANCE_DB_PASSWORD가 필요하다}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD:?RESERVATION_DB_PASSWORD가 필요하다}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD가 필요하다}
      FAKE_PG_DB_PASSWORD: ${FAKE_PG_DB_PASSWORD:-fake_pg_local_pw}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ticket"]
      interval: 5s
      retries: 10
    networks: [ticket-data]

  # 좌석 선점·대기열·캐시용. 데이터는 컨테이너 안에만 둔다(로컬 개발용). 컨테이너를 다시 만들면 사라진다.
  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [ticket-data]

  # KRaft 모드(Zookeeper 없음), 브로커 1대. 최종 프로젝트 발제의 Compose 템플릿을 이 저장소의 네트워크·포트 방식에 맞췄다.
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Note: INTERNAL은 컨테이너끼리(kafka:29092), EXTERNAL은 이 PC에서 IDE로 띄운 앱(localhost:9092)이 쓴다.
      # 브로커는 접속한 리스너에 맞는 광고 주소를 돌려주므로, 클라이언트가 어느 쪽에서 붙든 다시 찾아올 수 있다.
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # 브로커가 1대라서 내부 토픽 복제 수를 1로 맞춘다(기본값 3)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 12
      start_period: 20s
    networks: [ticket-data]

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8989}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [ticket-data]

  # 수집 대상은 Eureka에서 찾는다(infra/prometheus/prometheus.yml). 서비스를 추가·확장해도 이 설정은 바뀌지 않는다.
  # 업무 서비스가 Eureka에 등록하는 ticket-net IP로 긁어야 하므로 ticket-net에 붙인다.
  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      eureka-server:
        condition: service_started
    networks: [ticket-net]

  grafana:
    image: grafana/grafana:13.2.4
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD가 필요하다}
    volumes:
      # Prometheus 데이터 소스를 기동할 때 자동으로 등록한다
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [ticket-net]

  config-server:
    <<: *app
    build:
      context: ./backend
      args: { MODULE: config-server }
    ports:
      - "127.0.0.1:${CONFIG_SERVER_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8888/actuator/health || exit 1"]
      interval: 5s
      retries: 20

  eureka-server:
    <<: *app
    build:
      context: ./backend
      args: { MODULE: eureka-server }
    ports:
      - "127.0.0.1:${EUREKA_PORT:-8761}:8761"

  gateway-service:
    <<: *app
    build:
      context: ./backend
      args: { MODULE: gateway-service }
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *service-env
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started

  user-service:
    <<: *db-service
    build:
      context: ./backend
      args: { MODULE: user-service }
    environment:
      <<: *service-env
      JWT_SECRET: ${JWT_SECRET}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      MASTER_EMAIL: ${MASTER_EMAIL:-}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-}

  performance-service:
    <<: *db-service
    build:
      context: ./backend
      args: { MODULE: performance-service }
    environment:
      <<: *service-env
      PERFORMANCE_DB_PASSWORD: ${PERFORMANCE_DB_PASSWORD}

  reservation-service:
    <<: *db-service
    build:
      context: ./backend
      args: { MODULE: reservation-service }
    environment:
      <<: *service-env
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD}
      # 대기열 켜고 끄기(config-repo/reservation-service.yml의 reservation.queue.enabled). 켜려면 QUEUE_ENABLED=true로 띄운다
      QUEUE_ENABLED: ${QUEUE_ENABLED:-false}

  payment-service:
    <<: *db-service
    build:
      context: ./backend
      args: { MODULE: payment-service }
    environment:
      <<: *service-env
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      # 토스·카카오 PG 대신 fake PG를 부른다
      PG_BASE_URL: http://fake-pg:8090

  # 토스 형식의 API를 흉내 내는 테스트용 PG(backend/fake-pg). 바깥 PG처럼 Eureka·Config Server 없이 주소로만 찾아간다.
  # payment-service와 k6가 부르고, 관리 API(/fake/admin/**)로 장애를 건다. Gateway 라우트에는 없다.
  fake-pg:
    <<: *app
    build:
      context: ./backend
      args: { MODULE: fake-pg }
    networks: [ticket-net, ticket-data]
    ports:
      - "127.0.0.1:${FAKE_PG_PORT:-8090}:8090"
    environment:
      DB_HOST: postgres
      FAKE_PG_DB_PASSWORD: ${FAKE_PG_DB_PASSWORD:-fake_pg_local_pw}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8090/actuator/health || exit 1"]
      interval: 5s
      retries: 20

networks:
  # 앞단. 대역을 고정해야 위의 preferred-networks 접두어와 맞출 수 있다. Docker 기본 풀(172.17~31, 192.168)과 겹치지 않고,
  # logistics-management(10.210.10.0/24)와 같은 PC에서 함께 띄워도 겹치지 않게 10.220을 쓴다.
  ticket-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${TICKET_NET_SUBNET:-10.220.10.0/24}
  # 데이터. internal: true로 막으면 postgres·redis의 127.0.0.1 포트 공개(psql·IDE 접속)가 안 되므로 일반 bridge로 둔다.
  ticket-data:
    driver: bridge

volumes:
  pgdata:
  kafka-data:
  grafana-data:
