# 실행: docker compose up -d --build   (빌드는 backend/Dockerfile 안에서 한다)
# 사전 준비: cp .env.example .env
# 관리용 포트(postgres, redis, config-server, eureka)는 이 PC(127.0.0.1)에서만 열고, 외부에는 Gateway 8080만 공개한다.
# 네트워크는 둘이다. ticket-net(앞단: Gateway·플랫폼·업무 서비스), ticket-data(업무 서비스·postgres·redis).
# 업무 서비스만 두 네트워크에 함께 붙고, Gateway는 postgres·redis에 닿지 않는다.

x-app: &app
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: on-failure
  networks: [ticket-net]

# backend/config-repo의 ${...} 자리표시자를 채우는 값. 설정 자체는 config-server가 내려준다.
x-service-env: &service-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://eureka-server:8761/eureka
  # Note: 컨테이너 호스트명(컨테이너 ID) 대신 IP로 Eureka에 등록해야 Gateway가 다른 컨테이너에서 찾아갈 수 있다.
  EUREKA_PREFER_IP: "true"
  # Note: 업무 서비스는 네트워크가 둘이라 IP도 둘이다. ticket-data 쪽 IP가 Eureka에 등록되면 그 네트워크에 없는 Gateway가
  # 연결하지 못한다. 등록할 IP를 ticket-net 대역으로 고정한다(spring.cloud.inetutils.preferred-networks, 접두어 일치).
  SPRING_CLOUD_INETUTILS_PREFERREDNETWORKS: ${TICKET_NET_PREFIX:-10.220.10.}
  DB_HOST: postgres
  REDIS_HOST: redis

x-db-service: &db-service
  <<: *app
  networks: [ticket-net, ticket-data]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    config-server:
      condition: service_healthy
    eureka-server:
      condition: service_started

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ticket
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD가 필요하다}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD:?EVENT_DB_PASSWORD가 필요하다}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD:?RESERVATION_DB_PASSWORD가 필요하다}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD가 필요하다}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ticket"]
      interval: 5s
      retries: 10
    networks: [ticket-data]

  # 좌석 선점·대기열·캐시용. 데이터는 컨테이너 안에만 둔다(로컬 개발용). 컨테이너를 다시 만들면 사라진다.
  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [ticket-data]

  config-server:
    <<: *app
    build:
      context: ./backend
      args: { MODULE: config-server }
    ports:
      - "127.0.0.1:${CONFIG_SERVER_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8888/actuator/health || exit 1"]
      interval: 5s
      retries: 20

  eureka-server:
    <<: *app
    build:
      context: ./backend
      args: { MODULE: eureka-server }
    ports:
      - "127.0.0.1:${EUREKA_PORT:-8761}:8761"

  gateway-service:
    <<: *app
    build:
      context: ./backend
      args: { MODULE: gateway-service }
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *service-env
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started

  user-service:
    <<: *db-service
    build:
      context: ./backend
      args: { MODULE: user-service }
    environment:
      <<: *service-env
      JWT_SECRET: ${JWT_SECRET}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      MASTER_USERNAME: ${MASTER_USERNAME:-}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-}

  event-service:
    <<: *db-service
    build:
      context: ./backend
      args: { MODULE: event-service }
    environment:
      <<: *service-env
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD}

  reservation-service:
    <<: *db-service
    build:
      context: ./backend
      args: { MODULE: reservation-service }
    environment:
      <<: *service-env
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD}

  payment-service:
    <<: *db-service
    build:
      context: ./backend
      args: { MODULE: payment-service }
    environment:
      <<: *service-env
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}

networks:
  # 앞단. 대역을 고정해야 위의 preferred-networks 접두어와 맞출 수 있다. Docker 기본 풀(172.17~31, 192.168)과 겹치지 않고,
  # logistics-management(10.210.10.0/24)와 같은 PC에서 함께 띄워도 겹치지 않게 10.220을 쓴다.
  ticket-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${TICKET_NET_SUBNET:-10.220.10.0/24}
  # 데이터. internal: true로 막으면 postgres·redis의 127.0.0.1 포트 공개(psql·IDE 접속)가 안 되므로 일반 bridge로 둔다.
  ticket-data:
    driver: bridge

volumes:
  pgdata:
